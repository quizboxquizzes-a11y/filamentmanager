<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Stock Checker</title>

    <style>
        :root {
            --bg: #1A1A1A; --card: #232323; --border: #2E2E2E; --text: #EAEAEA;
            --accent: #00FF7F; --danger: #FF4C4C; --warning: #FFD700; --shadow: 0 4px 14px rgba(0,0,0,0.35);
        }
        :root.light {
            --bg: #FFFFFF; --card: #F7F7F7; --border: #DDDDDD; --text: #111;
            --accent: #00B368; --danger: #E53935; --warning: #F9A825; --shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        body { margin: 0; padding: 0 20px 100px 20px; background: var(--bg); color: var(--text); font-family: "Segoe UI", sans-serif; transition: 0.25s; }
        
        .header { display: flex; justify-content: flex-start; align-items: center; padding: 30px 0; max-width: 1100px; margin: 0 auto; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        
        .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; max-width: 1100px; margin: 20px auto; box-shadow: var(--shadow); position: relative; }
        h2 { margin-top: 0; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.9; }
        input { width: 100%; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 15px; margin-bottom: 12px; box-sizing: border-box; outline: none; }

        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 15px; }
        @media (max-width: 900px) { .inventory-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .inventory-grid { grid-template-columns: 1fr; } }

        .stock-item { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; position: relative; }
        .weight-display { font-size: 22px; font-weight: 800; color: var(--accent); margin: 5px 0; }
        .progress-container { width: 100%; height: 7px; background: #333; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); transition: width 0.6s ease; }
        .weight-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
        .weight-btn { padding: 10px; font-size: 11px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; }

        .btn-ui { width: 100%; background: transparent; color: var(--accent); padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 800; border: 2px solid var(--accent); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: 10px; }
        .btn-print { width: 100%; background: var(--accent); color: #000; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: 0.2s; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: none; color: var(--danger); border: none; cursor: pointer; font-size: 20px; opacity: 0.3; }
        
        .search-results { max-height: 350px; overflow-y: auto; background: var(--bg); border: 2px solid var(--accent); border-radius: 10px; margin-bottom: 15px; display: none; z-index: 1000; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-item { padding: 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .search-item:hover { background: var(--card); color: var(--accent); }

        .tag { padding: 12px; margin: 8px 0; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-size: 14px; display: flex; flex-direction: column; gap: 4px;}
        .tag.missing { border-left: 4px solid var(--danger); }
        .tag.ready { border-left: 4px solid var(--accent); }

        .avail-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .avail-item { background: var(--bg); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 6px; }
        .avail-item.ready { border: 1px solid var(--accent); background: rgba(0, 255, 127, 0.05); }
        .avail-item.almost { border: 1px solid var(--warning); background: rgba(255, 215, 0, 0.05); }

        .color-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); display: inline-block; }
        .dot-row { display: flex; gap: 6px; }
        .mini-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); }
    </style>
</head>
<body onclick="closeAllResults(event)">

<div class="header">
    <div class="logo-container">
        <div style="font-size: 24px; font-weight: 900; color: var(--accent);">FILAMENT STOCK</div>
    </div>
</div>

<div class="section">
    <h2>Ready to Print</h2>
    <div id="readyList" class="avail-list"></div>
    <h2 style="margin-top: 20px; color: var(--warning);">Almost Ready (70%+)</h2>
    <div id="almostList" class="avail-list"></div>
</div>

<div class="section">
    <h2>Inventory Manager</h2>
    <input id="filamentSearchMain" placeholder="Click to add filament to inventory..." onfocus="updateSearch('main')" oninput="updateSearch('main')">
    <div id="results-main" class="search-results"></div>
    <div id="ownedList" class="inventory-grid"></div>
</div>

<div class="section" id="checker-section">
    <h2>Project Checker</h2>
    <input id="projSearchCheck" placeholder="Search projects..." onfocus="updateProjSearch()" oninput="updateProjSearch()">
    <div id="results-proj" class="search-results"></div>
    <div id="result-box"></div>
</div>

<script>
    const playbookProjects = {
        backgammon: [{ f: "Bambu PLA Matte Dark Brown (11801)", g: 150 }, { f: "Bambu PLA Matte Bone White", g: 120 }, { f: "Bambu PLA Matte Dark Blue (11602)", g: 43 }],
        cribbage: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 285.5 }, { f: "Bambu PLA Matte Ivory White (11100)", g: 182.4 }, { f: "Bambu PLA Matte Dark Red", g: 29.12 }],
        hangman: [{ f: "Bambu PLA Matte Charcoal (11101)", g: 410 }, { f: "Bambu PLA Matte Desert Tan", g: 240.5 }, { f: "Bambu PLA Matte Bone White", g: 88.03 }],
        sea_battle: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 310 }, { f: "Bambu PLA Matte Ash Grey (11102)", g: 215 }, { f: "Bambu PLA Matte Dark Red", g: 31 }, { f: "Bambu PLA Matte Bone White", g: 25 }],
        chess: [{ f: "Bambu PLA Matte Dark Brown (11801)", g: 320 }, { f: "Bambu PLA Matte Bone White", g: 320 }]
    };

    const filaments = ["Bambu PLA Black (10101)", "Bambu PLA Jade White (10100)", "Bambu PLA Matte Charcoal (11101)", "Bambu PLA Matte Bone White", "Bambu PLA Matte Dark Blue (11602)", "Bambu PLA Matte Dark Red", "Bambu PLA Matte Dark Brown (11801)"];
    const filamentColors = { "Black": "#0a0a0a", "White": "#ffffff", "Charcoal": "#2b2b2b", "Bone": "#e3dac9", "Blue": "#0000ff", "Red": "#ff0000", "Brown": "#5d4037" };

    function getFilamentColor(name) {
        for(const [key, val] of Object.entries(filamentColors)) { if(name.includes(key)) return val; }
        return "#888";
    }

    function updateAvailableProjects() {
        const stock = JSON.parse(localStorage.getItem('stock') || "{}");
        const readyDiv = document.getElementById('readyList');
        const almostDiv = document.getElementById('almostList');
        
        let readyArr = [];
        let almostArr = [];

        Object.keys(playbookProjects).forEach(key => {
            const reqs = playbookProjects[key];
            const stats = checkFeasibility(reqs, stock);
            const data = { name: key.replace(/_/g, ' '), val: "p:"+key, fils: reqs, ...stats };
            
            if(stats.isReady) readyArr.push(data);
            else if(stats.percentage >= 70) almostArr.push(data);
        });

        const renderItem = (p, type) => `
            <div class="avail-item ${type}" onclick="checkProject('${p.val}', '${p.name}')">
                <b>${p.name.toUpperCase()}</b>
                <div style="display:flex; justify-content: space-between; align-items:center; gap:10px;">
                    <small style="opacity:0.6">${p.matchCount}/${p.totalCount}</small>
                    <div class="dot-row">${p.fils.map(f => `<div class="mini-dot" style="background:${(stock[f.f] && stock[f.f].current >= f.g) ? getFilamentColor(f.f) : 'transparent'}; border-color:${getFilamentColor(f.f)}"></div>`).join('')}</div>
                </div>
            </div>`;

        readyDiv.innerHTML = readyArr.length ? readyArr.map(p => renderItem(p, 'ready')).join('') : "<small style='opacity:0.5'>None ready.</small>";
        almostDiv.innerHTML = almostArr.length ? almostArr.map(p => renderItem(p, 'almost')).join('') : "<small style='opacity:0.5'>None near completion.</small>";
    }

    function checkFeasibility(reqs, stock) {
        let matchCount = 0;
        let isReady = true;
        reqs.forEach(req => {
            const current = stock[req.f] ? stock[req.f].current : 0;
            if (current >= req.g) matchCount++; else isReady = false;
        });
        return { isReady, matchCount, totalCount: reqs.length, percentage: (matchCount / reqs.length) * 100 };
    }

    function adjustWeight(f, amount) {
        let s = JSON.parse(localStorage.getItem('stock') || "{}");
        if (!s[f]) s[f] = { current: 1000, max: 1000 };
        s[f].current = parseFloat((s[f].current + amount).toFixed(2));
        if (amount === -9999 || s[f].current < 0) delete s[f];
        localStorage.setItem('stock', JSON.stringify(s));
        renderStock();
        updateAvailableProjects();
    }

    function renderStock() {
        const s = JSON.parse(localStorage.getItem('stock') || "{}");
        const container = document.getElementById('ownedList');
        container.innerHTML = Object.keys(s).map(f => `
            <div class="stock-item">
                <button class="delete-btn" onclick="adjustWeight('${f}', -9999)">×</button>
                <div style="font-size:11px; font-weight:700; opacity:0.7;">${f}</div>
                <div class="weight-display">${s[f].current}g</div>
                <div class="progress-container"><div class="progress-bar" style="width:${(s[f].current/1000)*100}%"></div></div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="color-dot" style="background:${getFilamentColor(f)}"></div>
                    <div class="weight-controls" style="flex-grow:1; margin-left:10px;">
                        <button class="weight-btn" onclick="adjustWeight('${f}', -50)">-50g</button>
                        <button class="weight-btn" onclick="adjustWeight('${f}', 100)">+100g</button>
                    </div>
                </div>
            </div>`).join('');
    }

    function updateSearch(type) {
        const q = document.getElementById('filamentSearchMain').value.toLowerCase();
        const res = document.getElementById('results-main');
        res.style.display = 'block';
        res.innerHTML = filaments.filter(f => f.toLowerCase().includes(q)).map(f => `<div class="search-item" onmousedown="adjustWeight('${f}', 0)">${f}</div>`).join('') + `<div class="search-item" style="color:var(--danger)" onmousedown="forceCloseResults()">Close</div>`;
    }

    function updateProjSearch() {
        const q = document.getElementById('projSearchCheck').value.toLowerCase();
        const res = document.getElementById('results-proj');
        res.style.display = 'block';
        res.innerHTML = Object.keys(playbookProjects).filter(k => k.includes(q)).map(k => `<div class="search-item" onmousedown="checkProject('p:${k}', '${k}')">${k}</div>`).join('') + `<div class="search-item" style="color:var(--danger)" onmousedown="forceCloseResults()">Close</div>`;
    }

    function checkProject(val, name) {
        const id = val.split(':')[1];
        const reqs = playbookProjects[id];
        const stock = JSON.parse(localStorage.getItem('stock') || "{}");
        let canPrint = true;
        let html = `<div style="margin-top:20px; padding:20px; background:var(--bg); border-radius:12px; border:2px solid var(--accent);"><h3>${name.toUpperCase()}</h3>`;
        reqs.forEach(item => {
            const current = stock[item.f] ? stock[item.f].current : 0;
            if(current < item.g) canPrint = false;
            html += `<div class="tag ${current < item.g ? 'missing' : 'ready'}"><b>${item.f}</b>: ${current}g / ${item.g}g</div>`;
        });
        if(canPrint) html += `<button class="btn-print" onclick="commitPrint('${id}')">🚀 Commit to Print</button>`;
        document.getElementById('result-box').innerHTML = html + `</div>`;
        forceCloseResults();
        document.getElementById('checker-section').scrollIntoView({ behavior: 'smooth' });
    }

    function commitPrint(id) {
        if(!confirm("Subtract weights from stock?")) return;
        let s = JSON.parse(localStorage.getItem('stock') || "{}");
        playbookProjects[id].forEach(item => { if(s[item.f]) s[item.f].current = Math.max(0, s[item.f].current - item.g); });
        localStorage.setItem('stock', JSON.stringify(s));
        renderStock(); updateAvailableProjects();
        document.getElementById('result-box').innerHTML = "<div style='color:var(--accent); text-align:center; padding:10px;'>Stock Updated!</div>";
    }

    function forceCloseResults() { document.querySelectorAll('.search-results').forEach(r => r.style.display = 'none'); }
    function closeAllResults(e) { if (!e.target.closest('input') && !e.target.closest('.search-results')) forceCloseResults(); }

    renderStock();
    updateAvailableProjects();
</script>
</body>
</html>
