<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Stock Checker</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%2300FF7F' stroke-width='8'/><circle cx='50' cy='50' r='12' fill='%2300FF7F'/><g stroke='%2300FF7F' stroke-width='8' stroke-linecap='round'><line x1='50' y1='20' x2='50' y2='38'/><line x1='24' y1='65' x2='40' y2='56'/><line x1='76' y1='65' x2='60' y2='56'/></g></svg>">

    <style>
        :root {
            --bg: #1A1A1A; --card: #232323; --border: #2E2E2E; --text: #EAEAEA;
            --accent: #00FF7F; --danger: #FF4C4C; --warning: #FFD700; --null: #666; --shadow: 0 4px 14px rgba(0,0,0,0.35);
            --dot-border: rgba(255,255,255,0.8);
            --btn-text: #000000; /* Black text for dark mode buttons */
        }
        :root.light {
            --bg: #FFFFFF; --card: #F2F2F2; --border: #CCCCCC; --text: #111;
            --accent: #00B368; --danger: #E53935; --warning: #F9A825; --null: #888; --shadow: 0 4px 14px rgba(0,0,0,0.12);
            --dot-border: rgba(0,0,0,0.3);
            --btn-text: #FFFFFF; /* White text for light mode buttons */
        }

        body { margin: 0; padding: 0 20px 100px 20px; background: var(--bg); color: var(--text); font-family: "Segoe UI", sans-serif; transition: 0.25s; }
        
        .scene { display: none; }
        .scene.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .nav-bar { display: flex; justify-content: center; gap: 10px; margin: 0 auto 20px auto; max-width: 1100px; padding: 10px 0; }
        .nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        
        /* Updated nav button active text color */
        .nav-btn.active { border-color: var(--accent); color: var(--accent); }
        :root.light .nav-btn.active { background: var(--accent); color: white; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; max-width: 1100px; margin: 0 auto; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        #logo-svg { width: 48px; height: 48px; overflow: visible; }
        
        .animate-spin { animation: spoolSpin 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: center; }
        @keyframes spoolSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; max-width: 1100px; margin: 20px auto; box-shadow: var(--shadow); position: relative; }
        h2 { margin-top: 0; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.9; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 15px; margin-bottom: 12px; box-sizing: border-box; outline: none; }

        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 15px; }
        @media (max-width: 900px) { .inventory-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .inventory-grid { grid-template-columns: 1fr; } }

        .stock-item { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; position: relative; transition: box-shadow 0.3s; }
        
        .stock-item.low-stock-alert { border-color: var(--warning); box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); animation: pulseAlert 2s infinite ease-in-out; }
        @keyframes pulseAlert { 0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.1); } 50% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); } 100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.1); } }
        .low-stock-text { color: var(--warning) !important; }

        .stock-clickable { cursor: pointer; transition: opacity 0.2s; }
        
        .weight-display { font-size: 22px; font-weight: 800; color: var(--accent); margin: 5px 0; }
        .cost-badge { font-size: 11px; background: rgba(0,255,127,0.1); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .progress-container { width: 100%; height: 7px; background: #333; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); transition: width 0.6s ease; }
        .weight-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
        .weight-btn { padding: 10px; font-size: 11px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Main green button text color update */
        .btn-print { width: 100%; background: var(--accent); color: var(--btn-text); padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: 0.2s; }
        
        .btn-add { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 8px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: none; color: var(--danger); border: none; cursor: pointer; font-size: 20px; opacity: 0.3; }
        
        .search-results { max-height: 350px; overflow-y: auto; background: var(--bg); border: 2px solid var(--accent); border-radius: 10px; margin-bottom: 15px; display: none; z-index: 1000; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-item { padding: 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .search-item:hover { background: var(--card); color: var(--accent); }

        .project-card { background: var(--bg); border: 2px solid var(--accent); border-radius: 16px; padding: 25px; margin-top: 20px; }
        .tag { padding: 12px; margin: 8px 0; border-radius: 8px; background: var(--card); border: 1px solid var(--border); font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .tag.missing { border-left: 5px solid var(--danger); }
        .tag.ready { border-left: 5px solid var(--accent); }
        .tag.split { border-left: 5px solid var(--warning); }

        .avail-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .avail-item { background: var(--bg); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; font-size: 13px; cursor: pointer; width: 220px; }
        .avail-item.ready { border: 1px solid var(--accent); }
        .avail-item.almost { border: 1px solid var(--warning); }
        .avail-item.missing-stock { border: 1px solid var(--danger); }
        .avail-item.no-stock { border: 1px solid var(--null); opacity: 0.6; filter: grayscale(1); }

        .mini-progress { height: 4px; background: #333; border-radius: 2px; overflow: hidden; width: 100%; }
        .mini-progress-fill { height: 100%; transition: width 0.4s; }
        
        .mini-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--dot-border); box-shadow: inset 0 0 3px rgba(0,0,0,0.4); display: inline-block; }
        .color-dot-large { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--dot-border); box-shadow: inset 0 0 5px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2); }

        .theme-toggle-container { position: fixed; bottom: 30px; right: 30px; z-index: 999; }
        .theme-toggle { width: 60px; height: 32px; background: var(--border); border-radius: 30px; cursor: pointer; position: relative; }
        .theme-toggle-circle { width: 24px; height: 24px; background: var(--accent); border-radius: 50%; position: absolute; top: 4px; left: 4px; transition: 0.4s; }
        :root.light .theme-toggle-circle { left: 32px; }

        .backup-footer { max-width: 1100px; margin: 40px auto; display: flex; gap: 10px; justify-content: center; opacity: 0.5; }
        .btn-small { background: none; border: 1px solid var(--text); color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        #clear-filter-btn { display: none; background: var(--danger); color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body onclick="closeAllResults(event)">

<div class="header">
    <div class="logo-container" onclick="triggerLogoAnimation(); switchScene('projects');">
        <svg id="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="4" opacity="0.1"/>
            <circle cx="50" cy="50" r="12" fill="var(--accent)"/>
            <g stroke="var(--accent)" stroke-width="8" stroke-linecap="round">
                <line x1="50" y1="15" x2="50" y2="35"/>
                <line x1="20" y1="68" x2="38" y2="58"/>
                <line x1="80" y1="68" x2="62" y2="58"/>
            </g>
        </svg>
        <div style="font-size: 24px; font-weight: 900; color: var(--accent);">FILAMENT STOCK</div>
    </div>
</div>

<div class="nav-bar">
    <button class="nav-btn active" id="btn-projects" onclick="switchScene('projects')">PROJECTS</button>
    <button class="nav-btn" id="btn-inventory" onclick="switchScene('inventory')">INVENTORY</button>
    <button class="nav-btn" id="btn-create" onclick="switchScene('create')">CREATE NEW</button>
</div>

<div id="scene-projects" class="scene active">
    <div class="section">
        <div style="display:flex; align-items:center; margin-bottom:15px;">
            <h2 id="project-header">Project Availability</h2>
            <button id="clear-filter-btn" onclick="activeFilamentFilter = null; updateAvailableProjects();">CLEAR FILTER</button>
        </div>
        <h2>Ready to Print</h2>
        <div id="readyList" class="avail-list"></div>
        <h2 style="margin-top: 25px; color: var(--warning);">Almost Ready (70%+)</h2>
        <div id="almostList" class="avail-list"></div>
        <h2 style="margin-top: 25px; color: var(--danger);">Missing Materials</h2>
        <div id="missingList" class="avail-list"></div>
        <h2 style="margin-top: 25px; color: var(--null);">No Stock at All</h2>
        <div id="noneList" class="avail-list"></div>
    </div>

    <div class="section" id="checker-section">
        <h2>Project Checker</h2>
        <input id="projSearchCheck" placeholder="Search Playbook'd or Custom..." onfocus="updateProjSearch()" oninput="updateProjSearch()">
        <div id="results-proj" class="search-results"></div>
        <div id="result-box"></div>
    </div>
</div>

<div id="scene-inventory" class="scene">
    <div class="section">
        <h2>Inventory Manager</h2>
        <input id="filamentSearchMain" placeholder="Click to add a new physical spool..." onfocus="updateSearch()" oninput="updateSearch()">
        <div id="results-main" class="search-results"></div>
        <div id="ownedList" class="inventory-grid"></div>
        <button class="btn-print" style="margin-top: 30px; background: var(--card); border: 1px solid var(--accent); color: var(--accent);" onclick="switchScene('projects')">Save & Return to Projects</button>
    </div>
</div>

<div id="scene-create" class="scene">
    <div class="section">
        <h2>Create Custom Project</h2>
        <input id="customProjName" placeholder="Project Name (e.g. My Cool Statue)">
        <div id="customInputs">
            <div style="display:flex; gap:10px;">
                <select class="custom-fil-select"></select>
                <input type="number" class="custom-fil-grams" placeholder="Grams">
            </div>
        </div>
        <button class="btn-add" onclick="addCustomInput()">+ Add Another Color</button>
        <button class="btn-print" onclick="saveCustomProject()">Save & View Projects</button>
    </div>
</div>

<div class="backup-footer">
    <button class="btn-small" onclick="exportData()">💾 EXPORT BACKUP</button>
    <button class="btn-small" onclick="document.getElementById('importFile').click()">📂 RESTORE BACKUP</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)">
</div>

<div class="theme-toggle-container">
    <div class="theme-toggle" onclick="toggleTheme()"><div class="theme-toggle-circle"></div></div>
</div>

<script>
    let activeFilamentFilter = null;
    const COST_PER_GRAM = 0.02; // £20 per kg
    const LOW_STOCK_THRESHOLD = 150; 

    function switchScene(sceneId) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('scene-' + sceneId).classList.add('active');
        document.getElementById('btn-' + sceneId).classList.add('active');
        if(sceneId === 'projects') updateAvailableProjects();
        window.scrollTo(0,0);
    }

    const playbookProjects = {
};

    const filamentsList = ["Bambu PLA Black (10101)", "Bambu PLA Jade White (10100)", "Bambu PLA Matte Charcoal (11101)", "Bambu PLA Matte Bone White", "Bambu PLA Matte Dark Blue (11602)", "Bambu PLA Matte Dark Red", "Bambu PLA Matte Dark Brown (11801)", "Bambu PLA Matte Ivory White (11100)", "Bambu PLA Matte Ash Grey (11102)", "Bambu PLA Matte Desert Tan", "Bambu PLA Matte Terracotta", "Bambu PLA Matte Dark Chocolate (11802)", "Bambu PLA Matte Yellow (10400)", "Bambu PLA Matte Apple Green (11502)", "Bambu PLA Matte Grass Green", "Bambu PLA Matte Mandarin Orange (11300)"];
    
    const filamentColors = { 
        "Black": "#000000", "White": "#F8F8F8", "Charcoal": "#333333", "Bone": "#D8C9B0", 
        "Blue": "#1a73e8", "Red": "#d93025", "Brown": "#5d4037", "Ivory": "#E5E2C5", 
        "Ash": "#70757a", "Tan": "#c2a47c", "Terracotta": "#e2725b", "Chocolate": "#3e2723", 
        "Yellow": "#f9ab00", "Apple": "#79a300", "Grass": "#2d8a43", "Mandarin": "#f28500" 
    };

    function triggerLogoAnimation() {
        const logo = document.getElementById('logo-svg');
        logo.classList.remove('animate-spin');
        setTimeout(() => logo.classList.add('animate-spin'), 10);
    }

    function toggleTheme() {
        document.documentElement.classList.toggle('light');
        localStorage.setItem('theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
        triggerLogoAnimation();
    }

    function getFilamentColor(name) {
        for(const [key, val] of Object.entries(filamentColors)) { if(name.includes(key)) return val; }
        return "#888";
    }

    function getCombinedStock() {
        const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const totals = {};
        spools.forEach(s => { totals[s.name] = (totals[s.name] || 0) + s.current; });
        return totals;
    }

    function getAllProjects() {
        const custom = JSON.parse(localStorage.getItem('customProjects') || "{}");
        return {...playbookProjects, ...custom};
    }

    function filterByFilament(name) {
        activeFilamentFilter = name;
        switchScene('projects');
    }

    function updateAvailableProjects() {
        const totals = getCombinedStock();
        const all = getAllProjects();
        const readyDiv = document.getElementById('readyList');
        const almostDiv = document.getElementById('almostList');
        const missingDiv = document.getElementById('missingList');
        const noneDiv = document.getElementById('noneList');
        const clearBtn = document.getElementById('clear-filter-btn');
        
        clearBtn.style.display = activeFilamentFilter ? 'inline-block' : 'none';
        
        let readyArr = [], almostArr = [], missingArr = [], noneArr = [];

        Object.keys(all).forEach(key => {
            const reqs = all[key];
            if (activeFilamentFilter && !reqs.some(r => r.f === activeFilamentFilter)) return;
            let matchCount = 0;
            let totalStockForProject = 0;
            reqs.forEach(req => { 
                const stock = totals[req.f] || 0;
                if (stock >= req.g) matchCount++; 
                totalStockForProject += stock;
            });
            const percentage = (matchCount / reqs.length) * 100;
            const displayName = playbookProjects[key] ? "Playbook: " + key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : key;
            const prefix = playbookProjects[key] ? "p:" : "c:";
            const data = { name: displayName, val: prefix + key, fils: reqs, matchCount, totalCount: reqs.length, isReady: matchCount === reqs.length, percentage };
            if(data.isReady) readyArr.push(data); 
            else if(percentage >= 70) almostArr.push(data);
            else if(totalStockForProject > 0) missingArr.push(data);
            else noneArr.push(data);
        });

        const renderItem = (p, type) => {
            let barColor = type === 'ready' ? 'var(--accent)' : (type === 'almost' ? 'var(--warning)' : 'var(--danger)');
            return `
            <div class="avail-item ${type === 'missing' ? 'missing-stock' : (type === 'none' ? 'no-stock' : type)}" onclick="checkProject('${p.val}', '${p.name.replace(/'/g, "\\'")}')">
                <b>${p.name}</b>
                <div class="mini-progress"><div class="mini-progress-fill" style="width:${p.percentage}%; background:${barColor}"></div></div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <small style="opacity:0.6">${p.matchCount}/${p.totalCount}</small>
                    <div style="display:flex; gap:4px;">
                        ${p.fils.map(f => `<div class="mini-dot" style="background:${getFilamentColor(f.f)}; opacity:${(totals[f.f] >= f.g) ? '1' : '0.3'}"></div>`).join('')}
                    </div>
                </div>
            </div>`;
        };
        
        readyDiv.innerHTML = readyArr.length ? readyArr.map(p => renderItem(p, 'ready')).join('') : "<small>None.</small>";
        almostDiv.innerHTML = almostArr.length ? almostArr.map(p => renderItem(p, 'almost')).join('') : "<small>None.</small>";
        missingDiv.innerHTML = missingArr.length ? missingArr.map(p => renderItem(p, 'missing')).join('') : "<small>None.</small>";
        noneDiv.innerHTML = noneArr.length ? noneArr.map(p => renderItem(p, 'none')).join('') : "<small>None.</small>";
    }

    function addCustomInput() {
        const container = document.getElementById('customInputs');
        const div = document.createElement('div');
        div.style.display = 'flex'; div.style.gap = '10px';
        div.innerHTML = `<select class="custom-fil-select">${filamentsList.map(f => `<option value="${f}">${f}</option>`).join('')}</select><input type="number" class="custom-fil-grams" placeholder="Grams">`;
        container.appendChild(div);
    }

    function saveCustomProject() {
        const name = document.getElementById('customProjName').value.trim();
        if(!name) return;
        const selects = document.querySelectorAll('.custom-fil-select');
        const grams = document.querySelectorAll('.custom-fil-grams');
        let reqs = [];
        selects.forEach((s, i) => { if(grams[i].value > 0) reqs.push({ f: s.value, g: parseFloat(grams[i].value) }); });
        let custom = JSON.parse(localStorage.getItem('customProjects') || "{}");
        custom[name] = reqs;
        localStorage.setItem('customProjects', JSON.stringify(custom));
        switchScene('projects');
    }

    function addNewSpool(name) {
        let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        spools.push({ id: Date.now(), name, current: 1000, max: 1000 });
        localStorage.setItem('multiSpools', JSON.stringify(spools));
        renderStock(); forceCloseResults();
    }

    function adjustWeight(id, amount) {
        let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const idx = spools.findIndex(s => s.id === id);
        if (idx !== -1) {
            if (amount === -9999) {
                spools.splice(idx, 1);
            } else {
                spools[idx].current = Math.max(0, parseFloat((spools[idx].current + amount).toFixed(2)));
                if (spools[idx].current <= 0) spools.splice(idx, 1);
            }
        }
        localStorage.setItem('multiSpools', JSON.stringify(spools));
        renderStock();
    }

    function renderStock() {
        const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const container = document.getElementById('ownedList');
        spools.sort((a,b) => a.name.localeCompare(b.name));
        container.innerHTML = spools.map(s => {
            const spoolVal = (s.current * COST_PER_GRAM).toFixed(2);
            const isLow = s.current < LOW_STOCK_THRESHOLD;
            
            return `<div class="stock-item ${isLow ? 'low-stock-alert' : ''}">
            <button class="delete-btn" onclick="adjustWeight(${s.id}, -9999)">×</button>
            <div class="stock-clickable" onclick="filterByFilament('${s.name.replace(/'/g, "\\'")}')" style="font-size:10px; opacity:0.7; overflow:hidden; display:flex; justify-content:space-between;">
                <span>${s.name}</span>
                <span class="cost-badge">£${spoolVal}</span>
            </div>
            <div class="weight-display ${isLow ? 'low-stock-text' : ''}">${s.current}g</div>
            <div class="progress-container"><div class="progress-bar" style="width:${(s.current/s.max)*100}%; background:${isLow ? 'var(--warning)' : 'var(--accent)'}"></div></div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="color-dot-large stock-clickable" onclick="filterByFilament('${s.name.replace(/'/g, "\\'")}')" style="background:${getFilamentColor(s.name)}"></div>
                <div class="weight-controls" style="flex-grow:1; margin-left:10px;">
                    <button class="weight-btn" onclick="adjustWeight(${s.id}, -50)">-50g</button>
                    <button class="weight-btn" onclick="adjustWeight(${s.id}, 100)">+100g</button>
                </div>
            </div>
        </div>`}).join('');
    }

    function updateSearch() {
        const q = document.getElementById('filamentSearchMain').value.toLowerCase();
        const res = document.getElementById('results-main'); res.style.display = 'block';
        res.innerHTML = filamentsList.filter(f => f.toLowerCase().includes(q)).map(f => `<div class="search-item" onmousedown="addNewSpool('${f.replace(/'/g, "\\'")}')">${f}</div>`).join('') + `<div class="search-item" style="color:var(--danger)" onmousedown="forceCloseResults()">Close</div>`;
    }

    function updateProjSearch() {
        const q = document.getElementById('projSearchCheck').value.toLowerCase();
        const res = document.getElementById('results-proj'); res.style.display = 'block';
        const all = getAllProjects();
        res.innerHTML = Object.keys(all).filter(k => k.toLowerCase().includes(q)).map(k => {
            const disp = playbookProjects[k] ? "Playbook: " + k.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : k;
            const prefix = playbookProjects[k] ? "p:" : "c:";
            return `<div class="search-item" onmousedown="checkProject('${prefix}${k}', '${disp.replace(/'/g, "\\'")}')">${disp}</div>`;
        }).join('') + `<div class="search-item" style="color:var(--danger)" onmousedown="forceCloseResults()">Close</div>`;
    }

    function checkProject(val, name) {
        const parts = val.split(':');
        const id = parts[1];
        const allProjs = getAllProjects();
        const reqs = allProjs[id]; 
        const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const totals = getCombinedStock(); 
        let canPrint = true;
        let totalGrams = 0;
        
        reqs.forEach(i => totalGrams += i.g);
        const totalCost = (totalGrams * COST_PER_GRAM).toFixed(2);

        let html = `<div class="project-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <div>
                    <h3 style="margin:0; color:var(--accent);">${name}</h3>
                    <div class="cost-badge" style="margin-top:5px; display:inline-block;">ESTIMATED COST: £${totalCost}</div>
                </div>
                ${parts[0] === 'c' ? `<button onclick="deleteCustomProject('${id}')" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">DELETE</button>` : ''}
            </div>`;
            
        reqs.forEach(item => {
            const totalAvailable = totals[item.f] || 0; 
            const isMissing = totalAvailable < item.g;
            if(isMissing) canPrint = false;

            const matchingSpools = spools.filter(s => s.name === item.f);
            const needsSplit = !isMissing && matchingSpools.length > 1 && !matchingSpools.some(s => s.current >= item.g);

            let statusClass = isMissing ? 'missing' : (needsSplit ? 'split' : 'ready');
            let statusLabel = needsSplit ? ' (SPLIT SPOOLS)' : '';

            html += `<div class="tag ${statusClass}"><div style="display:flex; align-items:center; gap:8px;"><div class="mini-dot" style="background:${getFilamentColor(item.f)}"></div><b>${item.f}${statusLabel}</b></div><span>${totalAvailable}g / ${item.g}g</span></div>`;
        });
        
        if(canPrint) html += `<button class="btn-print" onclick="commitPrint('${id}')">🚀 COMMIT TO PRINT</button>`;
        else html += `<div style="text-align:center; padding:10px; opacity:0.5; font-size:12px;">Insufficient stock.</div>`;
        
        document.getElementById('result-box').innerHTML = html + `</div>`;
        forceCloseResults(); 
        
        setTimeout(() => { document.getElementById('result-box').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
    }

    function deleteCustomProject(name) {
        if(!confirm("Delete?")) return;
        let custom = JSON.parse(localStorage.getItem('customProjects') || "{}");
        delete custom[name];
        localStorage.setItem('customProjects', JSON.stringify(custom));
        document.getElementById('result-box').innerHTML = "";
        updateAvailableProjects();
    }

    function commitPrint(projId) {
        if(!confirm("Deduct stock?")) return;
        let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const reqs = getAllProjects()[projId];
        reqs.forEach(req => {
            let needed = req.g;
            let rel = spools.filter(s => s.name === req.f).sort((a,b) => a.current - b.current);
            rel.forEach(rs => {
                if (needed <= 0) return;
                const sUpdate = spools.find(s => s.id === rs.id);
                if (sUpdate.current >= needed) { sUpdate.current = parseFloat((sUpdate.current - needed).toFixed(2)); needed = 0; }
                else { needed -= sUpdate.current; sUpdate.current = 0; }
            });
        });

        spools = spools.filter(s => s.current > 0);
        localStorage.setItem('multiSpools', JSON.stringify(spools));
        renderStock(); updateAvailableProjects();
        document.getElementById('result-box').innerHTML = "<div style='color:var(--accent); text-align:center; padding:20px;'>Stock Deducted & Empties Removed.</div>";
    }

    function exportData() {
        const data = { multiSpools: JSON.parse(localStorage.getItem('multiSpools') || "[]"), customProjects: JSON.parse(localStorage.getItem('customProjects') || "{}") };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `filament_backup.json`; a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.multiSpools) localStorage.setItem('multiSpools', JSON.stringify(data.multiSpools));
                if (data.customProjects) localStorage.setItem('customProjects', JSON.stringify(data.customProjects));
                location.reload();
            } catch (err) { alert("Invalid backup file."); }
        };
        reader.readAsText(file);
    }

    function forceCloseResults() { document.querySelectorAll('.search-results').forEach(r => r.style.display = 'none'); }
    function closeAllResults(e) { if (!e.target.closest('input') && !e.target.closest('.search-results')) forceCloseResults(); }

    if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
    document.querySelectorAll('.custom-fil-select').forEach(s => s.innerHTML = filamentsList.map(f => `<option value="${f}">${f}</option>`).join(''));
    renderStock(); updateAvailableProjects();
</script>
</body>
</html>
