<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Stock Checker</title>
    <link rel="icon" href="https://img.icons8.com/fluency/48/3d-printer.png" type="image/png">

    <style>
        :root {
            --bg: #1A1A1A; --card: #232323; --border: #2E2E2E; --text: #EAEAEA;
            --accent: #00FF7F; --danger: #FF4C4C; --warning: #FFD700; --shadow: 0 4px 14px rgba(0,0,0,0.35);
        }
        body { margin: 0; padding: 0 20px 100px 20px; background: var(--bg); color: var(--text); font-family: "Segoe UI", sans-serif; transition: 0.25s; }
        .header { display: flex; justify-content: flex-start; align-items: center; padding: 30px 0; max-width: 1100px; margin: 0 auto; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; max-width: 1100px; margin: 20px auto; box-shadow: var(--shadow); position: relative; }
        h2 { margin-top: 0; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.9; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 15px; margin-bottom: 12px; box-sizing: border-box; outline: none; }
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 15px; }
        @media (max-width: 900px) { .inventory-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .inventory-grid { grid-template-columns: 1fr; } }
        .stock-item { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; position: relative; }
        .weight-display { font-size: 22px; font-weight: 800; color: var(--accent); margin: 5px 0; }
        .progress-container { width: 100%; height: 7px; background: #333; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); transition: width 0.6s ease; }
        .weight-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
        .weight-btn { padding: 10px; font-size: 11px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-print { width: 100%; background: var(--accent); color: #000; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: 0.2s; }
        .btn-add { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 8px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: none; color: var(--danger); border: none; cursor: pointer; font-size: 20px; opacity: 0.3; }
        .search-results { max-height: 350px; overflow-y: auto; background: var(--bg); border: 2px solid var(--accent); border-radius: 10px; margin-bottom: 15px; display: none; z-index: 1000; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-item { padding: 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .search-item:hover { background: var(--card); color: var(--accent); }
        .tag { padding: 12px; margin: 8px 0; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-size: 14px; display: flex; flex-direction: column; gap: 4px;}
        .tag.missing { border-left: 4px solid var(--danger); }
        .tag.ready { border-left: 4px solid var(--accent); }
        .avail-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .avail-item { background: var(--bg); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 6px; }
        .avail-item.ready { border: 1px solid var(--accent); background: rgba(0, 255, 127, 0.05); }
        .avail-item.almost { border: 1px solid var(--warning); background: rgba(255, 215, 0, 0.05); }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); display: inline-block; }
        .mini-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); }
    </style>
</head>
<body onclick="closeAllResults(event)">

<div class="header">
    <div class="logo-container" onclick="location.reload()">
        <img src="https://img.icons8.com/fluency/48/3d-printer.png" alt="Logo" width="32">
        <div style="font-size: 24px; font-weight: 900; color: var(--accent);">FILAMENT STOCK</div>
    </div>
</div>

<div class="section">
    <h2>Ready to Print</h2>
    <div id="readyList" class="avail-list"></div>
    <h2 style="margin-top: 20px; color: var(--warning);">Almost Ready (70%+)</h2>
    <div id="almostList" class="avail-list"></div>
</div>

<div class="section">
    <h2>Inventory Manager</h2>
    <input id="filamentSearchMain" placeholder="Click to add a new physical spool..." onfocus="updateSearch()" oninput="updateSearch()">
    <div id="results-main" class="search-results"></div>
    <div id="ownedList" class="inventory-grid"></div>
</div>

<div class="section" id="checker-section">
    <h2>Project Checker</h2>
    <input id="projSearchCheck" placeholder="Search Playbook'd or Custom..." onfocus="updateProjSearch()" oninput="updateProjSearch()">
    <div id="results-proj" class="search-results"></div>
    <div id="result-box"></div>
</div>

<div class="section">
    <h2>Create Custom Project</h2>
    <input id="customProjName" placeholder="Project Name (e.g. My Cool Statue)">
    <div id="customInputs">
        <div style="display:flex; gap:10px;">
            <select class="custom-fil-select"></select>
            <input type="number" class="custom-fil-grams" placeholder="Grams">
        </div>
    </div>
    <button class="btn-add" onclick="addCustomInput()">+ Add Another Color</button>
    <button class="btn-print" onclick="saveCustomProject()">Save Project</button>
</div>

<script>
    const playbookProjects = {
        backgammon: [{ f: "Bambu PLA Matte Dark Brown (11801)", g: 150 }, { f: "Bambu PLA Matte Bone White", g: 120 }, { f: "Bambu PLA Matte Dark Blue (11602)", g: 43 }],
        cribbage: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 285.5 }, { f: "Bambu PLA Matte Ivory White (11100)", g: 182.4 }, { f: "Bambu PLA Matte Dark Red", g: 29.12 }],
        hangman: [{ f: "Bambu PLA Matte Charcoal (11101)", g: 410 }, { f: "Bambu PLA Matte Desert Tan", g: 240.5 }, { f: "Bambu PLA Matte Bone White", g: 88.03 }],
        chess: [{ f: "Bambu PLA Matte Dark Brown (11801)", g: 320 }, { f: "Bambu PLA Matte Bone White", g: 320 }],
        sea_battle: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 310 }, { f: "Bambu PLA Matte Ash Grey (11102)", g: 215 }, { f: "Bambu PLA Matte Dark Red", g: 31 }, { f: "Bambu PLA Matte Bone White", g: 25 }],
        mancala: [{ f: "Bambu PLA Matte Terracotta", g: 280 }, { f: "Bambu PLA Matte Dark Blue (11602)", g: 90 }, { f: "Bambu PLA Matte Bone White", g: 75 }],
        crosswords: [{ f: "Bambu PLA Matte Dark Chocolate (11802)", g: 240 }, { f: "Bambu PLA Matte Desert Tan", g: 110 }, { f: "Bambu PLA Matte Bone White", g: 80 }, { f: "Bambu PLA Matte Dark Blue (11602)", g: 40 }],
        four_in_a_row: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 210 }, { f: "Bambu PLA Matte Dark Red", g: 145 }, { f: "Bambu PLA Matte Yellow (10400)", g: 145 }],
        checkers: [{ f: "Bambu PLA Matte Charcoal (11101)", g: 240 }, { f: "Bambu PLA Matte Bone White", g: 240 }, { f: "Bambu PLA Matte Dark Red", g: 50 }],
        reversi: [{ f: "Bambu PLA Matte Apple Green (11502)", g: 260 }, { f: "Bambu PLA Matte Charcoal (11101)", g: 120 }, { f: "Bambu PLA Matte Bone White", g: 120 }],
        snakes_and_ladders: [{ f: "Bambu PLA Matte Grass Green", g: 290 }, { f: "Bambu PLA Matte Ivory White (11100)", g: 160 }, { f: "Bambu PLA Matte Mandarin Orange (11300)", g: 40 }],
        settlers_storage: [{ f: "Bambu PLA Matte Terracotta", g: 380 }, { f: "Bambu PLA Matte Bone White", g: 110 }],
        sling_puck: [{ f: "Bambu PLA Matte Dark Green (11501)", g: 310 }, { f: "Bambu PLA Matte Bone White", g: 90 }],
        shut_the_box: [{ f: "Bambu PLA Matte Terracotta", g: 275 }, { f: "Bambu PLA Matte Charcoal (11101)", g: 115 }, { f: "Bambu PLA Matte Bone White", g: 30 }],
        hook_and_ring: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 240 }, { f: "Bambu PLA Matte Ash Grey (11102)", g: 120 }, { f: "Bambu PLA Matte Dark Red", g: 40 }]
    };

    const filamentsList = ["Bambu PLA Black (10101)", "Bambu PLA Jade White (10100)", "Bambu PLA Matte Charcoal (11101)", "Bambu PLA Matte Bone White", "Bambu PLA Matte Dark Blue (11602)", "Bambu PLA Matte Dark Red", "Bambu PLA Matte Dark Brown (11801)", "Bambu PLA Matte Ivory White (11100)", "Bambu PLA Matte Ash Grey (11102)", "Bambu PLA Matte Desert Tan", "Bambu PLA Matte Terracotta", "Bambu PLA Matte Dark Chocolate (11802)", "Bambu PLA Matte Yellow (10400)", "Bambu PLA Matte Apple Green (11502)", "Bambu PLA Matte Grass Green", "Bambu PLA Matte Mandarin Orange (11300)"];
    const filamentColors = { "Black": "#0a0a0a", "White": "#ffffff", "Charcoal": "#2b2b2b", "Bone": "#e3dac9", "Blue": "#0000ff", "Red": "#ff0000", "Brown": "#5d4037", "Ivory": "#fffff0", "Ash": "#b2b2b2", "Tan": "#d2b48c", "Terracotta": "#e2725b", "Chocolate": "#3e2723", "Yellow": "#ffd700", "Apple": "#8db600", "Grass": "#7cfc00", "Mandarin": "#f28500" };

    function getFilamentColor(name) {
        for(const [key, val] of Object.entries(filamentColors)) { if(name.includes(key)) return val; }
        return "#888";
    }

    function getCombinedStock() {
        const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const totals = {};
        spools.forEach(s => { totals[s.name] = (totals[s.name] || 0) + s.current; });
        return totals;
    }

    function getAllProjects() {
        const custom = JSON.parse(localStorage.getItem('customProjects') || "{}");
        return {...playbookProjects, ...custom};
    }

    function updateAvailableProjects() {
        const totals = getCombinedStock();
        const all = getAllProjects();
        const readyDiv = document.getElementById('readyList');
        const almostDiv = document.getElementById('almostList');
        let readyArr = []; let almostArr = [];

        Object.keys(all).forEach(key => {
            const reqs = all[key];
            let matchCount = 0; let isReady = true;
            reqs.forEach(req => { if ((totals[req.f] || 0) >= req.g) matchCount++; else isReady = false; });
            const percentage = (matchCount / reqs.length) * 100;
            const displayName = playbookProjects[key] ? "Playbook'd: " + key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : key;
            const data = { name: displayName, val: "p:"+key, fils: reqs, matchCount, totalCount: reqs.length, isReady, percentage };
            if(isReady) readyArr.push(data); else if(percentage >= 70) almostArr.push(data);
        });

        const renderItem = (p, type) => `<div class="avail-item ${type}" onclick="checkProject('${p.val}', '${p.name.replace(/'/g, "\\'")}')"><b>${p.name}</b><div style="display:flex; justify-content:space-between; align-items:center; gap:10px;"><small style="opacity:0.6">${p.matchCount}/${p.totalCount}</small><div style="display:flex; gap:4px;">${p.fils.map(f => `<div class="mini-dot" style="background:${(totals[f.f] >= f.g) ? getFilamentColor(f.f) : 'transparent'}; border-color:${getFilamentColor(f.f)}"></div>`).join('')}</div></div></div>`;
        readyDiv.innerHTML = readyArr.length ? readyArr.map(p => renderItem(p, 'ready')).join('') : "<small style='opacity:0.5'>None ready.</small>";
        almostDiv.innerHTML = almostArr.length ? almostArr.map(p => renderItem(p, 'almost')).join('') : "<small style='opacity:0.5'>None near completion.</small>";
    }

    function addCustomInput() {
        const container = document.getElementById('customInputs');
        const div = document.createElement('div');
        div.style.display = 'flex'; div.style.gap = '10px';
        div.innerHTML = `<select class="custom-fil-select">${filamentsList.map(f => `<option value="${f}">${f}</option>`).join('')}</select><input type="number" class="custom-fil-grams" placeholder="Grams">`;
        container.appendChild(div);
    }

    function saveCustomProject() {
        const name = document.getElementById('customProjName').value.trim();
        if(!name) return alert("Enter project name");
        const selects = document.querySelectorAll('.custom-fil-select');
        const grams = document.querySelectorAll('.custom-fil-grams');
        let reqs = [];
        selects.forEach((s, i) => { if(grams[i].value > 0) reqs.push({ f: s.value, g: parseFloat(grams[i].value) }); });
        if(reqs.length === 0) return alert("Add at least one filament requirement");
        let custom = JSON.parse(localStorage.getItem('customProjects') || "{}");
        custom[name] = reqs;
        localStorage.setItem('customProjects', JSON.stringify(custom));
        alert("Custom Project Saved!");
        location.reload();
    }

    function addNewSpool(name) {
        let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        spools.push({ id: Date.now(), name, current: 1000, max: 1000 });
        localStorage.setItem('multiSpools', JSON.stringify(spools));
        renderStock(); updateAvailableProjects(); forceCloseResults();
    }

    function adjustWeight(id, amount) {
        let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const idx = spools.findIndex(s => s.id === id);
        if (idx !== -1) {
            if (amount === -9999) spools.splice(idx, 1);
            else spools[idx].current = Math.max(0, parseFloat((spools[idx].current + amount).toFixed(2)));
        }
        localStorage.setItem('multiSpools', JSON.stringify(spools));
        renderStock(); updateAvailableProjects();
    }

    function renderStock() {
        const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const container = document.getElementById('ownedList');
        spools.sort((a,b) => a.name.localeCompare(b.name));
        container.innerHTML = spools.map(s => `<div class="stock-item"><button class="delete-btn" onclick="adjustWeight(${s.id}, -9999)">×</button><div style="font-size:10px; font-weight:700; opacity:0.7; overflow:hidden;">${s.name}</div><div class="weight-display">${s.current}g</div><div class="progress-container"><div class="progress-bar" style="width:${(s.current/s.max)*100}%"></div></div><div style="display:flex; justify-content:space-between; align-items:center;"><div class="color-dot" style="background:${getFilamentColor(s.name)}"></div><div class="weight-controls" style="flex-grow:1; margin-left:10px;"><button class="weight-btn" onclick="adjustWeight(${s.id}, -50)">-50g</button><button class="weight-btn" onclick="adjustWeight(${s.id}, 100)">+100g</button></div></div></div>`).join('');
    }

    function updateSearch() {
        const q = document.getElementById('filamentSearchMain').value.toLowerCase();
        const res = document.getElementById('results-main'); res.style.display = 'block';
        res.innerHTML = filamentsList.filter(f => f.toLowerCase().includes(q)).map(f => `<div class="search-item" onmousedown="addNewSpool('${f.replace(/'/g, "\\'")}')">${f}</div>`).join('') + `<div class="search-item" style="color:var(--danger)" onmousedown="forceCloseResults()">Close</div>`;
    }

    function updateProjSearch() {
        const q = document.getElementById('projSearchCheck').value.toLowerCase();
        const res = document.getElementById('results-proj'); res.style.display = 'block';
        const all = getAllProjects();
        res.innerHTML = Object.keys(all).filter(k => k.toLowerCase().includes(q)).map(k => {
            const disp = playbookProjects[k] ? "Playbook'd: " + k.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : k;
            return `<div class="search-item" onmousedown="checkProject('p:${k}', '${disp.replace(/'/g, "\\'")}')">${disp}</div>`;
        }).join('') + `<div class="search-item" style="color:var(--danger)" onmousedown="forceCloseResults()">Close</div>`;
    }

    function checkProject(val, name) {
        const id = val.split(':')[1]; const reqs = getAllProjects()[id]; const totals = getCombinedStock(); let canPrint = true;
        let html = `<div style="margin-top:20px; padding:20px; background:var(--bg); border-radius:12px; border:2px solid var(--accent);"><h3>${name}</h3>`;
        reqs.forEach(item => {
            const total = totals[item.f] || 0; if(total < item.g) canPrint = false;
            html += `<div class="tag ${total < item.g ? 'missing' : 'ready'}"><b>${item.f}</b>: ${total}g / ${item.g}g</div>`;
        });
        if(canPrint) html += `<button class="btn-print" onclick="commitPrint('${id}')">🚀 Commit to Print</button>`;
        document.getElementById('result-box').innerHTML = html + `</div>`;
        forceCloseResults(); document.getElementById('checker-section').scrollIntoView({ behavior: 'smooth' });
    }

    function commitPrint(projId) {
        if(!confirm("Deduct stock?")) return;
        let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const reqs = getAllProjects()[projId];
        reqs.forEach(req => {
            let needed = req.g;
            let rel = spools.filter(s => s.name === req.f).sort((a,b) => a.current - b.current);
            rel.forEach(rs => {
                if (needed <= 0) return;
                const sUpdate = spools.find(s => s.id === rs.id);
                if (sUpdate.current >= needed) { sUpdate.current = parseFloat((sUpdate.current - needed).toFixed(2)); needed = 0; }
                else { needed -= sUpdate.current; sUpdate.current = 0; }
            });
        });
        localStorage.setItem('multiSpools', JSON.stringify(spools));
        renderStock(); updateAvailableProjects();
        document.getElementById('result-box').innerHTML = "<div style='color:var(--accent); text-align:center; padding:10px;'>Print logged! Scraps used first.</div>";
    }

    function forceCloseResults() { document.querySelectorAll('.search-results').forEach(r => r.style.display = 'none'); }
    function closeAllResults(e) { if (!e.target.closest('input') && !e.target.closest('.search-results')) forceCloseResults(); }

    document.querySelectorAll('.custom-fil-select').forEach(s => s.innerHTML = filamentsList.map(f => `<option value="${f}">${f}</option>`).join(''));
    renderStock(); updateAvailableProjects();
</script>
</body>
</html>
