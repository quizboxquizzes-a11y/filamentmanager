<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Stock Manager</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%2300FF7F' stroke-width='8'/><circle cx='50' cy='50' r='12' fill='%2300FF7F'/><g stroke='%2300FF7F' stroke-width='8' stroke-linecap='round'><line x1='50' y1='20' x2='50' y2='38'/><line x1='24' y1='65' x2='40' y2='56'/><line x1='76' y1='65' x2='60' y2='56'/></g></svg>">

    <style>
        :root {
            --bg: #1A1A1A; --card: #232323; --border: #2E2E2E; --text: #EAEAEA;
            --accent: #00FF7F; --danger: #FF4C4C; --shadow: 0 4px 14px rgba(0,0,0,0.35);
        }
        :root.light {
            --bg: #FFFFFF; --card: #F7F7F7; --border: #DDDDDD; --text: #111;
            --accent: #00B368; --danger: #E53935; --shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        body { margin: 0; padding: 0 20px 100px 20px; background: var(--bg); color: var(--text); font-family: "Segoe UI", sans-serif; transition: 0.25s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; max-width: 1100px; margin: 0 auto; }
        .logo-container { display: flex; align-items: center; gap: 15px; cursor: pointer; user-select: none; }
        #logo-svg { width: 48px; height: 48px; overflow: visible; }
        
        .animate-active { 
            animation: pulseSpin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
            transform-origin: center;
        }
        @keyframes pulseSpin { 
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); filter: drop-shadow(0 0 10px var(--accent)); }
            100% { transform: scale(1) rotate(360deg); } 
        }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; max-width: 1100px; margin: 20px auto; box-shadow: var(--shadow); }
        h2 { margin-top: 0; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; }
        input { width: 100%; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 15px; margin-bottom: 12px; box-sizing: border-box; outline: none; }

        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-top: 15px; }
        .stock-item { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; position: relative; }
        .weight-display { font-size: 24px; font-weight: 800; color: var(--accent); margin: 8px 0; }
        .progress-container { width: 100%; height: 6px; background: #333; border-radius: 10px; margin: 12px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); transition: width 0.5s ease; }
        
        .weight-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .weight-btn { padding: 10px; font-size: 11px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .weight-btn:hover { border-color: var(--accent); color: var(--accent); }

        .btn-ui { width: 100%; background: transparent; color: var(--accent); padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; border: 2px solid var(--accent); cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        .btn-ui:hover { background: var(--accent); color: #000; }

        .delete-btn { position: absolute; top: 12px; right: 12px; background: none; color: var(--danger); border: none; cursor: pointer; font-size: 18px; opacity: 0.4; transition: 0.2s; }
        
        .search-results { max-height: 200px; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; display: none; position: relative; z-index: 10; margin-bottom: 10px; }
        .search-item { padding: 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .search-item:hover { background: var(--card); color: var(--accent); }

        .theme-toggle-container { position: fixed; bottom: 30px; right: 30px; z-index: 999; }
        .theme-toggle { width: 50px; height: 28px; background: var(--border); border-radius: 20px; cursor: pointer; position: relative; }
        .theme-toggle-circle { width: 20px; height: 20px; background: var(--accent); border-radius: 50%; position: absolute; top: 4px; left: 4px; transition: 0.3s; }
        :root.light .theme-toggle-circle { left: 26px; }

        .chip { display: inline-flex; align-items: center; background: var(--bg); padding: 8px 16px; border-radius: 25px; margin: 6px; border: 1px solid var(--accent); font-size: 13px; font-weight: 600; }
        .playbook-card { padding: 15px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .playbook-card:hover { border-color: var(--accent); background: rgba(0, 255, 127, 0.05); }
        .status-msg { margin-top: 10px; font-size: 14px; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-container" onclick="triggerLogo()">
        <svg id="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="6" opacity="0.2"/>
            <circle cx="50" cy="50" r="12" fill="var(--accent)"/>
            <g stroke="var(--accent)" stroke-width="8" stroke-linecap="round">
                <line x1="50" y1="15" x2="50" y2="35"/>
                <line x1="20" y1="68" x2="38" y2="58"/>
                <line x1="80" y1="68" x2="62" y2="58"/>
            </g>
            <circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="6" stroke-dasharray="276" stroke-dashoffset="60" />
        </svg>
        <div style="font-size: 22px; font-weight: 900; color: var(--accent);">FILAMENT STOCK MANAGER</div>
    </div>
</div>

<div class="section">
    <h2>Inventory Manager</h2>
    <input id="filamentSearchMain" placeholder="Search filaments to add to shelf..." oninput="updateSearch('main')">
    <div id="results-main" class="search-results"></div>
    <div id="ownedList" class="inventory-grid"></div>
</div>

<div class="section">
    <h2>Project Playbook</h2>
    <div id="playbook-list"></div>
    <div id="playbook-result" class="status-msg" style="display:none;"></div>
</div>

<div class="section">
    <h2>Custom Project Creator</h2>
    <input id="newProjName" placeholder="Project Name (e.g. Iron Man Helmet)">
    <input id="filamentSearchAdd" placeholder="Search filaments used..." oninput="updateSearch('add')">
    <div id="results-add" class="search-results"></div>
    <div id="chips" style="margin-bottom: 20px;"></div>
    <button class="btn-ui" onclick="saveProject()">Save Custom Requirement</button>
</div>

<div class="theme-toggle-container">
    <div class="theme-toggle" onclick="toggleTheme()"><div class="theme-toggle-circle"></div></div>
</div>

<script>
    const filaments = ["Bambu PLA Black (10101)", "Bambu PLA Jade White (10100)", "Bambu PLA Gray (10103)", "Bambu PLA Silver (10102)", "Bambu PLA Bronze", "Bambu PLA Gold", "Bambu PLA Green (10501)", "Bambu PLA Dark Red", "Bambu PLA Dark Blue", "Bambu PLA Yellow (10400)", "Bambu PLA Orange (10300)", "Bambu PLA Cyan (10603)", "Bambu PLA Magenta (10202)", "Bambu PLA Matte Charcoal (11101)", "Bambu PLA Matte Ash Grey (11102)", "Bambu PLA Matte Dark Blue (11602)", "Bambu PLA Matte Dark Green (11501)", "Bambu PLA Matte Terracotta", "Bambu PLA Matte Desert Tan", "Bambu PLA Matte Apple Green (11502)", "Bambu PLA Matte Ivory White (11100)", "Bambu PLA Matte Bone White", "Bambu PLA Matte Dark Brown (11801)", "Bambu PLA Matte Dark Chocolate (11802)", "Bambu PLA Matte Grass Green", "Bambu PLA Matte Mandarin Orange (11300)", "Bambu PLA Matte Yellow (10400)", "Polymaker PLA Jungle Green", "Polymaker PLA Stone Blue"];

    const playbook = [
        { name: "AMS Disconnect Tool", requirements: [{ f: "Bambu PLA Green (10501)", g: 12 }] },
        { name: "Standard Benchy", requirements: [{ f: "Bambu PLA Gray (10103)", g: 15 }] },
        { name: "AMS Spool Adapter (Set of 4)", requirements: [{ f: "Bambu PLA Black (10101)", g: 140 }] }
    ];

    let tempProj = [];

    function triggerLogo() {
        const logo = document.getElementById('logo-svg');
        logo.classList.remove('animate-active');
        void logo.offsetWidth; 
        logo.classList.add('animate-active');
    }

    function toggleTheme() { document.documentElement.classList.toggle('light'); triggerLogo(); }

    function updateSearch(type) {
        const inputId = type === 'main' ? 'filamentSearchMain' : 'filamentSearchAdd';
        const resultsId = type === 'main' ? 'results-main' : 'results-add';
        const q = document.getElementById(inputId).value.toLowerCase();
        const res = document.getElementById(resultsId);
        if(!q) { res.style.display = 'none'; return; }
        res.style.display = 'block';
        res.innerHTML = filaments.filter(f => f.toLowerCase().includes(q)).slice(0,8).map(f => `
            <div class="search-item" onclick="${type === 'main' ? `adjustWeight('${f.replace(/'/g, "\\'")}', 0)` : `addTempChip('${f.replace(/'/g, "\\'")}')` }">${f}</div>`).join('');
    }

    function addTempChip(f) {
        const grams = prompt(`Grams needed for ${f}:`, "50");
        if(grams) { tempProj.push({f: f, g: parseFloat(grams)}); renderChips(); }
        document.getElementById('results-add').style.display = 'none';
        document.getElementById('filamentSearchAdd').value = "";
    }

    function renderChips() {
        document.getElementById('chips').innerHTML = tempProj.map((p, i) => `<span class="chip">${p.f} (${p.g}g) <b onclick="tempProj.splice(${i},1);renderChips();" style="cursor:pointer;margin-left:10px;color:red">×</b></span>`).join('');
    }

    function renderPlaybook() {
        const container = document.getElementById('playbook-list');
        container.innerHTML = playbook.map((p, i) => `
            <div class="playbook-card" onclick="checkPlaybook(${i})">
                <div style="font-weight:bold;">${p.name}</div>
                <div style="font-size:12px; opacity:0.6;">${p.requirements.map(r => `${r.f}: ${r.g}g`).join(', ')}</div>
            </div>
        `).join('');
    }

    function checkPlaybook(index) {
        const proj = playbook[index];
        const stock = JSON.parse(localStorage.getItem('stock') || "{}");
        let missing = [];
        const resBox = document.getElementById('playbook-result');
        
        proj.requirements.forEach(req => {
            const owned = stock[req.f] ? stock[req.f].current : 0;
            if(owned < req.g) missing.push(`${req.f} (Need ${req.g}g, have ${owned}g)`);
        });

        resBox.style.display = 'block';
        if(missing.length === 0) {
            resBox.style.background = "rgba(0, 255, 127, 0.2)";
            resBox.style.color = "var(--accent)";
            resBox.innerText = `✅ Success! You have enough stock to print ${proj.name}.`;
        } else {
            resBox.style.background = "rgba(255, 76, 76, 0.2)";
            resBox.style.color = "var(--danger)";
            resBox.innerText = `❌ Warning: Low on ${missing.join(', ')}.`;
        }
    }

    function saveProject() {
        const name = document.getElementById('newProjName').value;
        if(!name || tempProj.length === 0) return alert("Add a name and filaments first!");
        playbook.push({name: name, requirements: [...tempProj]});
        renderPlaybook();
        tempProj = []; document.getElementById('newProjName').value = ""; renderChips();
    }

    function adjustWeight(f, amount) {
        let s = JSON.parse(localStorage.getItem('stock') || "{}");
        if (!s[f]) s[f] = { current: 1000, max: 1000 };
        s[f].current = Math.max(0, parseFloat((s[f].current + amount).toFixed(2)));
        if (amount === -9999) delete s[f];
        localStorage.setItem('stock', JSON.stringify(s));
        renderStock();
        document.getElementById('results-main').style.display = 'none';
        document.getElementById('filamentSearchMain').value = "";
    }

    function renderStock() {
        const s = JSON.parse(localStorage.getItem('stock') || "{}");
        const container = document.getElementById('ownedList');
        container.innerHTML = Object.keys(s).map(f => `
            <div class="stock-item">
                <button class="delete-btn" onclick="adjustWeight('${f.replace(/'/g, "\\'")}', -9999)" style="cursor:pointer; color:var(--danger);">×</button>
                <div style="font-size:12px; font-weight:700; opacity:0.8;">${f}</div>
                <div class="weight-display">${s[f].current}g</div>
                <div class="progress-container"><div class="progress-bar" style="width:${(s[f].current/s[f].max)*100}%"></div></div>
                <div class="weight-controls">
                    <button class="weight-btn" onclick="adjustWeight('${f.replace(/'/g, "\\'")}', -50)">-50g</button>
                    <button class="weight-btn" onclick="adjustWeight('${f.replace(/'/g, "\\'")}', 100)">+100g</button>
                </div>
            </div>`).join('');
    }

    renderStock();
    renderPlaybook();
</script>
</body>
</html>
