<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Stock Checker</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%2300FF7F' stroke-width='8'/><circle cx='50' cy='50' r='12' fill='%2300FF7F'/><g stroke='%2300FF7F' stroke-width='8' stroke-linecap='round'><line x1='50' y1='20' x2='50' y2='38'/><line x1='24' y1='65' x2='40' y2='56'/><line x1='76' y1='65' x2='60' y2='56'/></g></svg>">

    <style>
        :root {
            --bg: #1A1A1A; --card: #232323; --border: #2E2E2E; --text: #EAEAEA;
            --accent: #00FF7F; --danger: #FF4C4C; --shadow: 0 4px 14px rgba(0,0,0,0.35);
        }
        :root.light {
            --bg: #FFFFFF; --card: #F7F7F7; --border: #DDDDDD; --text: #111;
            --accent: #00B368; --danger: #E53935; --shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        body { margin: 0; padding: 0 20px 100px 20px; background: var(--bg); color: var(--text); font-family: "Segoe UI", sans-serif; transition: 0.25s; }
        
        .header { display: flex; justify-content: flex-start; align-items: center; padding: 30px 0; max-width: 1100px; margin: 0 auto; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        #logo-svg { width: 48px; height: 48px; overflow: visible; }
        
        .animate-spin { 
            animation: spoolSpin 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); 
            transform-origin: center;
        }
        @keyframes spoolSpin { 
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); } 
        }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; max-width: 1100px; margin: 20px auto; box-shadow: var(--shadow); position: relative; }
        h2 { margin-top: 0; font-size: 16px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.9; }
        input { width: 100%; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 15px; margin-bottom: 12px; box-sizing: border-box; outline: none; }

        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 15px; }
        @media (max-width: 900px) { .inventory-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .inventory-grid { grid-template-columns: 1fr; } }

        .stock-item { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; position: relative; }
        .weight-display { font-size: 22px; font-weight: 800; color: var(--accent); margin: 5px 0; }
        .progress-container { width: 100%; height: 7px; background: #333; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); transition: width 0.6s ease; }
        .weight-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
        .weight-btn { padding: 10px; font-size: 11px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; }

        .btn-ui { width: 100%; background: transparent; color: var(--accent); padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 800; border: 2px solid var(--accent); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: 10px; }
        .btn-ui:hover { background: var(--accent); color: #000; }
        .btn-danger { color: var(--danger); border-color: var(--danger); margin-top: 15px; padding: 10px; font-size: 14px; border: 1px solid var(--danger); background: transparent; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-danger:hover { background: var(--danger); color: white; }

        .delete-btn { position: absolute; top: 12px; right: 12px; background: none; color: var(--danger); border: none; cursor: pointer; font-size: 20px; opacity: 0.3; }
        
        .search-results { max-height: 350px; overflow-y: auto; background: var(--bg); border: 2px solid var(--accent); border-radius: 10px; margin-bottom: 15px; display: none; z-index: 1000; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-item { padding: 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .search-item:hover { background: var(--card); color: var(--accent); }
        
        .close-search-btn { padding: 10px; background: var(--card); color: var(--danger); text-align: center; font-weight: bold; cursor: pointer; border-top: 1px solid var(--border); font-size: 12px; text-transform: uppercase; }
        .close-search-btn:hover { background: var(--danger); color: white; }

        .chip { display: inline-flex; align-items: center; background: var(--bg); padding: 8px 16px; border-radius: 25px; margin: 6px; border: 1px solid var(--accent); font-size: 13px; font-weight: 600; }
        .tag { padding: 10px; margin: 5px 0; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-size: 14px; display: flex; justify-content: space-between;}
        .tag.missing { border-color: var(--danger); color: var(--danger); }

        .avail-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .avail-item { background: var(--bg); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .avail-item:hover { border-color: var(--accent); transform: translateY(-2px); }
        .avail-item.ready { border: 1px solid var(--accent); background: rgba(0, 255, 127, 0.05); }
        .avail-item.ready::before { content: "✅ "; }

        .theme-toggle-container { position: fixed; bottom: 30px; right: 30px; z-index: 999; }
        .theme-toggle { width: 60px; height: 32px; background: var(--border); border-radius: 30px; cursor: pointer; position: relative; }
        .theme-toggle-circle { width: 24px; height: 24px; background: var(--accent); border-radius: 50%; position: absolute; top: 4px; left: 4px; transition: 0.4s; }
        :root.light .theme-toggle-circle { left: 32px; }
    </style>
</head>
<body onclick="closeAllResults(event)">

<div class="header">
    <div class="logo-container" onclick="triggerLogoAnimation()">
        <svg id="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="4" opacity="0.1"/>
            <circle cx="50" cy="50" r="12" fill="var(--accent)"/>
            <g stroke="var(--accent)" stroke-width="8" stroke-linecap="round">
                <line x1="50" y1="15" x2="50" y2="35"/>
                <line x1="20" y1="68" x2="38" y2="58"/>
                <line x1="80" y1="68" x2="62" y2="58"/>
            </g>
            <circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="6" stroke-dasharray="276" stroke-dashoffset="60" />
        </svg>
        <div style="font-size: 24px; font-weight: 900; color: var(--accent);">FILAMENT STOCK</div>
    </div>
</div>

<div class="section">
    <h2>Projects Available</h2>
    <div id="availableProjectsList" class="avail-list">
        <div style="opacity: 0.5; font-size: 13px;">Add filaments to your inventory to see what you can print...</div>
    </div>
</div>

<div class="section">
    <h2>Inventory Manager</h2>
    <input id="filamentSearchMain" placeholder="Click to see filaments or type..." onfocus="updateSearch('main')" oninput="updateSearch('main')">
    <div id="results-main" class="search-results"></div>
    <div id="ownedList" class="inventory-grid"></div>
</div>

<div class="section">
    <h2>Project Checker</h2>
    <input id="projSearchCheck" placeholder="Click to see projects or type..." onfocus="updateProjSearch()" oninput="updateProjSearch()">
    <div id="results-proj" class="search-results"></div>
    <div id="result-box"></div>
</div>

<div class="section">
    <h2>Create Custom Project</h2>
    <input id="newProjName" placeholder="Enter custom project title...">
    <input id="filamentSearchAdd" placeholder="Click to add filaments..." onfocus="updateSearch('add')" oninput="updateSearch('add')">
    <div id="results-add" class="search-results"></div>
    <div id="chips" style="margin-bottom: 20px;"></div>
    <button class="btn-ui" onclick="saveProject()">Save Custom Project</button>
</div>

<div class="theme-toggle-container">
    <div class="theme-toggle" onclick="toggleTheme()"><div class="theme-toggle-circle"></div></div>
</div>

<script>
    const playbookProjects = {
        backgammon: [{ f: "Bambu PLA Matte Dark Brown (11801)", g: 150 }, { f: "Bambu PLA Matte Bone White", g: 120 }, { f: "Bambu PLA Matte Dark Blue (11602)", g: 43 }],
        cribbage: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 285.5 }, { f: "Bambu PLA Matte Ivory White (11100)", g: 182.4 }, { f: "Bambu PLA Matte Dark Red", g: 29.12 }],
        hangman: [{ f: "Bambu PLA Matte Charcoal (11101)", g: 410 }, { f: "Bambu PLA Matte Desert Tan", g: 240.5 }, { f: "Bambu PLA Matte Bone White", g: 88.03 }],
        chess: [{ f: "Bambu PLA Matte Dark Brown (11801)", g: 320 }, { f: "Bambu PLA Matte Bone White", g: 320 }],
        sea_battle: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 310 }, { f: "Bambu PLA Matte Ash Grey (11102)", g: 215 }, { f: "Bambu PLA Matte Dark Red", g: 31 }, { f: "Bambu PLA Matte Bone White", g: 25 }],
        mancala: [{ f: "Bambu PLA Matte Terracotta", g: 280 }, { f: "Bambu PLA Matte Dark Blue (11602)", g: 90 }, { f: "Bambu PLA Matte Bone White", g: 75 }],
        crosswords: [{ f: "Bambu PLA Matte Dark Chocolate (11802)", g: 240 }, { f: "Bambu PLA Matte Desert Tan", g: 110 }, { f: "Bambu PLA Matte Bone White", g: 80 }, { f: "Bambu PLA Matte Dark Blue (11602)", g: 40 }],
        four_in_a_row: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 210 }, { f: "Bambu PLA Matte Dark Red", g: 145 }, { f: "Bambu PLA Matte Yellow (10400)", g: 145 }],
        checkers: [{ f: "Bambu PLA Matte Charcoal (11101)", g: 240 }, { f: "Bambu PLA Matte Bone White", g: 240 }, { f: "Bambu PLA Matte Dark Red", g: 50 }],
        reversi: [{ f: "Bambu PLA Matte Apple Green (11502)", g: 260 }, { f: "Bambu PLA Matte Charcoal (11101)", g: 120 }, { f: "Bambu PLA Matte Bone White", g: 120 }],
        snakes_and_ladders: [{ f: "Bambu PLA Matte Grass Green", g: 290 }, { f: "Bambu PLA Matte Ivory White (11100)", g: 160 }, { f: "Bambu PLA Matte Mandarin Orange (11300)", g: 40 }],
        settlers_storage: [{ f: "Bambu PLA Matte Terracotta", g: 380 }, { f: "Bambu PLA Matte Bone White", g: 110 }],
        sling_puck: [{ f: "Bambu PLA Matte Dark Green (11501)", g: 310 }, { f: "Bambu PLA Matte Bone White", g: 90 }],
        shut_the_box: [{ f: "Bambu PLA Matte Terracotta", g: 275 }, { f: "Bambu PLA Matte Charcoal (11101)", g: 115 }, { f: "Bambu PLA Matte Bone White", g: 30 }],
        hook_and_ring: [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 240 }, { f: "Bambu PLA Matte Ash Grey (11102)", g: 120 }, { f: "Bambu PLA Matte Dark Red", g: 40 }]
    };

    const filaments = [
        "Bambu PLA Black (10101)", "Bambu PLA Jade White (10100)", "Bambu PLA Gray (10103)", "Bambu PLA Silver (10102)", 
        "Bambu PLA Bronze", "Bambu PLA Gold", "Bambu PLA Green (10501)", "Bambu PLA Dark Red", 
        "Bambu PLA Dark Blue", "Bambu PLA Yellow (10400)", "Bambu PLA Orange (10300)", "Bambu PLA Cyan (10603)", 
        "Bambu PLA Magenta (10202)", "Bambu PLA Matte Charcoal (11101)", "Bambu PLA Matte Ash Grey (11102)", 
        "Bambu PLA Matte Dark Blue (11602)", "Bambu PLA Matte Dark Green (11501)", "Bambu PLA Matte Terracotta", 
        "Bambu PLA Matte Desert Tan", "Bambu PLA Matte Apple Green (11502)", "Bambu PLA Matte Ivory White (11100)", 
        "Bambu PLA Matte Bone White", "Bambu PLA Matte Dark Brown (11801)", "Bambu PLA Matte Dark Chocolate (11802)",
        "Bambu PLA Matte Grass Green", "Bambu PLA Matte Mandarin Orange (11300)", "Bambu PLA Matte Yellow (10400)",
        "Bambu PLA Matte Ice Blue", "Bambu PLA Matte Lilac Purple", "Bambu PLA Matte Sakura Pink", 
        "Polymaker PLA Jungle Green", "Polymaker PLA Stone Blue"
    ];

    let tempProj = [];

    function triggerLogoAnimation() {
        const logo = document.getElementById('logo-svg');
        logo.classList.remove('animate-spin');
        setTimeout(() => logo.classList.add('animate-spin'), 10);
    }

    function toggleTheme() { 
        document.documentElement.classList.toggle('light'); 
        triggerLogoAnimation(); 
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") forceCloseResults();
    });

    function forceCloseResults() {
        document.querySelectorAll('.search-results').forEach(r => r.style.display = 'none');
    }

    function closeAllResults(e) {
        if (!e.target.closest('input') && !e.target.closest('.search-results')) {
            forceCloseResults();
        }
    }

    // --- Available Projects Logic (Updated with Prefix) ---
    function updateAvailableProjects() {
        const stock = JSON.parse(localStorage.getItem('stock') || "{}");
        const customProjs = JSON.parse(localStorage.getItem('customProjs') || "[]");
        const listDiv = document.getElementById('availableProjectsList');
        
        let available = [];

        // Check Playbook
        Object.keys(playbookProjects).forEach(key => {
            const reqs = playbookProjects[key];
            const stats = checkFeasibility(reqs, stock);
            if (stats.hasAny) {
                // Formatting name to include "Playbook'd:"
                const displayName = "Playbook'd: " + key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                available.push({ 
                    name: displayName, 
                    val: "p:"+key, 
                    realName: key.replace(/_/g, ' '),
                    ...stats 
                });
            }
        });

        // Check Custom
        customProjs.forEach(proj => {
            const stats = checkFeasibility(proj.fils, stock);
            if (stats.hasAny) {
                available.push({ name: proj.name, val: "c:"+proj.id, realName: proj.name, ...stats });
            }
        });

        if (available.length === 0) {
            listDiv.innerHTML = `<div style="opacity: 0.5; font-size: 13px;">No projects currently match your stock.</div>`;
            return;
        }

        available.sort((a, b) => b.isReady - a.isReady);

        listDiv.innerHTML = available.map(proj => `
            <div class="avail-item ${proj.isReady ? 'ready' : ''}" onclick="checkProject('${proj.val}', '${proj.name}')">
                ${proj.name} <small style="opacity:0.6">(${proj.matchCount}/${proj.totalCount})</small>
            </div>
        `).join('');
    }

    function checkFeasibility(reqs, stock) {
        let matchCount = 0;
        let isReady = true;
        reqs.forEach(req => {
            const current = stock[req.f] ? stock[req.f].current : 0;
            if (current >= req.g) {
                matchCount++;
            } else {
                isReady = false;
            }
        });
        return { hasAny: matchCount > 0, isReady: isReady, matchCount: matchCount, totalCount: reqs.length };
    }

    // --- Search & Filtering ---
    function updateSearch(type) {
        const inputId = type === 'main' ? 'filamentSearchMain' : 'filamentSearchAdd';
        const resultsId = type === 'main' ? 'results-main' : 'results-add';
        const q = document.getElementById(inputId).value.toLowerCase();
        const res = document.getElementById(resultsId);
        
        res.style.display = 'block';
        const filtered = filaments.filter(f => f.toLowerCase().includes(q));
        
        let html = filtered.map(f => `
            <div class="search-item" onmousedown="${type === 'main' ? `adjustWeight('${f.replace(/'/g, "\\'")}', 0)` : `addTempChip('${f.replace(/'/g, "\\'")}')` }">${f}</div>`).join('');
        
        html += `<div class="close-search-btn" onmousedown="forceCloseResults()">Close Results</div>`;
        res.innerHTML = html;
    }

    function updateProjSearch() {
        const q = document.getElementById('projSearchCheck').value.toLowerCase();
        const res = document.getElementById('results-proj');
        res.style.display = 'block';
        
        let matches = [];
        Object.keys(playbookProjects).forEach(k => { 
            if(k.includes(q)) matches.push({name: "Playbook: " + k.replace(/_/g, ' '), val: "p:"+k}); 
        });
        JSON.parse(localStorage.getItem('customProjs') || "[]").forEach(p => { 
            if(p.name.toLowerCase().includes(q)) matches.push({name: "Custom: " + p.name, val: "c:"+p.id}); 
        });
        
        let html = matches.map(m => `<div class="search-item" onmousedown="checkProject('${m.val}', '${m.name}')">${m.name}</div>`).join('');
        html += `<div class="close-search-btn" onmousedown="forceCloseResults()">Close Results</div>`;
        res.innerHTML = html;
    }

    // --- Logic & Storage ---
    function checkProject(val, name) {
        const [type, id] = val.split(':');
        const projs = (type === 'p') ? playbookProjects : JSON.parse(localStorage.getItem('customProjs'));
        const reqs = (type === 'p') ? projs[id] : projs.find(x => x.id == id).fils;
        const stock = JSON.parse(localStorage.getItem('stock') || "{}");
        
        let html = `<div style="margin-top:20px; padding:20px; background:var(--bg); border-radius:12px; border:1px solid var(--accent);">
                    <h3 style="margin-top:0; color:var(--accent); text-transform:uppercase; font-size:14px;">${name}</h3>`;
        
        reqs.forEach(item => {
            const current = stock[item.f] ? stock[item.f].current : 0;
            const isMissing = current < item.g;
            html += `<div class="tag ${isMissing ? 'missing' : ''}">
                        <span>${item.f}</span>
                        <span>${current}g / ${item.g}g</span>
                     </div>`;
        });

        if (type === 'c') {
            html += `<button class="btn-danger" onclick="deleteCustomProject(${id})">Delete Custom Project</button>`;
        }
        
        html += `</div>`;
        document.getElementById('result-box').innerHTML = html;
        forceCloseResults();
        window.scrollTo({ top: document.getElementById('result-box').offsetTop - 100, behavior: 'smooth' });
    }

    function deleteCustomProject(id) {
        if (!confirm("Are you sure you want to delete this custom project?")) return;
        let custom = JSON.parse(localStorage.getItem('customProjs') || "[]");
        custom = custom.filter(p => p.id !== id);
        localStorage.setItem('customProjs', JSON.stringify(custom));
        document.getElementById('result-box').innerHTML = "";
        updateAvailableProjects();
    }

    function addTempChip(f) {
        const grams = prompt(`Weight for ${f} (g):`, "100");
        if(grams) { tempProj.push({f: f, g: parseFloat(grams)}); renderChips(); }
        forceCloseResults();
    }

    function renderChips() {
        document.getElementById('chips').innerHTML = tempProj.map((p, i) => `<span class="chip">${p.f} (${p.g}g) <b onclick="tempProj.splice(${i},1);renderChips();" style="cursor:pointer;margin-left:10px;color:red">×</b></span>`).join('');
    }

    function saveProject() {
        const name = document.getElementById('newProjName').value;
        if(!name || tempProj.length === 0) return alert("Missing name or filaments");
        let custom = JSON.parse(localStorage.getItem('customProjs') || "[]");
        custom.push({id: Date.now(), name: name, fils: [...tempProj]});
        localStorage.setItem('customProjs', JSON.stringify(custom));
        tempProj = []; document.getElementById('newProjName').value = ""; renderChips();
        updateAvailableProjects();
    }

    function adjustWeight(f, amount) {
        let s = JSON.parse(localStorage.getItem('stock') || "{}");
        if (!s[f]) s[f] = { current: 1000, max: 1000 };
        s[f].current = parseFloat((s[f].current + amount).toFixed(2));
        if (amount === -9999 || s[f].current <= 0) delete s[f];
        localStorage.setItem('stock', JSON.stringify(s));
        renderStock();
        updateAvailableProjects();
        forceCloseResults();
    }

    function renderStock() {
        const s = JSON.parse(localStorage.getItem('stock') || "{}");
        const container = document.getElementById('ownedList');
        container.innerHTML = "";
        Object.keys(s).forEach(f => {
            const data = s[f];
            container.innerHTML += `
                <div class="stock-item">
                    <button class="delete-btn" onclick="adjustWeight('${f.replace(/'/g, "\\'")}', -9999)">×</button>
                    <div style="font-size:12px; font-weight:700; opacity:0.8;">${f}</div>
                    <div class="weight-display">${data.current}g</div>
                    <div class="progress-container"><div class="progress-bar" style="width:${(data.current/data.max)*100}%"></div></div>
                    <div class="weight-controls">
                        <button class="weight-btn" onclick="adjustWeight('${f.replace(/'/g, "\\'")}', -50)">-50g</button>
                        <button class="weight-btn" onclick="adjustWeight('${f.replace(/'/g, "\\'")}', 100)">+100g</button>
                    </div>
                </div>`;
        });
    }

    renderStock();
    updateAvailableProjects();
</script>
</body>
</html>
