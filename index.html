<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Stock Checker</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%2300FF7F' stroke-width='8'/><circle cx='50' cy='50' r='12' fill='%2300FF7F'/><g stroke='%2300FF7F' stroke-width='8' stroke-linecap='round'><line x1='50' y1='20' x2='50' y2='38'/><line x1='24' y1='65' x2='40' y2='56'/><line x1='76' y1='65' x2='60' y2='56'/></g></svg>">

    <style>
        :root {
            --bg: #1A1A1A; --card: #232323; --border: #2E2E2E; --text: #EAEAEA;
            --accent: #00FF7F; --danger: #FF4C4C; --warning: #FFD700; --null: #666; --shadow: 0 4px 14px rgba(0,0,0,0.35);
            --dot-border: rgba(255,255,255,0.8);
            --btn-text: #000000;
        }

        :root.light {
            --bg: #FFFFFF; --card: #F2F2F2; --border: #CCCCCC; --text: #111;
            --accent: #00B368; --danger: #E53935; --warning: #F9A825; --null: #888; --shadow: 0 4px 14px rgba(0,0,0,0.12);
            --dot-border: rgba(0,0,0,0.3);
            --btn-text: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0 20px 100px 20px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", sans-serif;
            transition: 0.25s;
        }

        .scene { display: none; }
        .scene.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 0 auto 20px auto;
            max-width: 1100px;
            padding: 10px 0;
        }

        .nav-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }

        .nav-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        :root.light .nav-btn.active {
            background: var(--accent);
            color: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            max-width: 1100px;
            margin: 0 auto;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        #logo-svg {
            width: 48px;
            height: 48px;
            overflow: visible;
        }

        .animate-spin {
            animation: spoolSpin 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }

        @keyframes spoolSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            max-width: 1100px;
            margin: 20px auto;
            box-shadow: var(--shadow);
            position: relative;
        }

        h2 {
            margin-top: 0;
            font-size: 14px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.9;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 15px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 15px;
        }

        @media (max-width: 900px) {
            .inventory-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .inventory-grid {
                grid-template-columns: 1fr;
            }
        }

        .stock-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
            position: relative;
            transition: box-shadow 0.3s;
        }

        .weight-display {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            margin: 5px 0;
        }

        .cost-badge {
            font-size: 11px;
            background: rgba(0,255,127,0.1);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            height: 7px;
            background: #333;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            transition: width 0.6s ease;
        }

        .weight-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .weight-btn {
            padding: 10px;
            font-size: 11px;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-print {
            width: 100%;
            background: var(--accent);
            color: var(--btn-text);
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 15px;
            transition: 0.2s;
        }

        .btn-add {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            color: var(--danger);
            border: none;
            cursor: pointer;
            font-size: 20px;
            opacity: 0.3;
        }

        .search-results {
            max-height: 350px;
            overflow-y: auto;
            background: var(--bg);
            border: 2px solid var(--accent);
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            z-index: 1000;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-item {
            padding: 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .search-item:hover {
            background: var(--card);
            color: var(--accent);
        }

        .mini-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--dot-border);
            box-shadow: inset 0 0 3px rgba(0,0,0,0.4);
            display: inline-block;
        }

        .color-dot-large {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--dot-border);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
        }

        .theme-toggle-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--border);
            border-radius: 30px;
            cursor: pointer;
            position: relative;
        }

        .theme-toggle-circle {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 4px;
            transition: 0.4s;
        }

        :root.light .theme-toggle-circle {
            left: 32px;
        }

        /* ===== CUSTOM FILAMENT CREATOR ===== */

        .custom-filament-box{
            margin-top:20px;
            padding:18px;
            border:1px solid var(--border);
            border-radius:14px;
            background:var(--bg);
        }

        .custom-filament-row{
            display:grid;
            grid-template-columns:1fr 1fr 1fr 70px;
            gap:10px;
            align-items:center;
        }

        @media (max-width:700px){
            .custom-filament-row{
                grid-template-columns:1fr;
            }
        }

        .color-preview{
            width:100%;
            height:48px;
            border-radius:10px;
            border:2px solid var(--dot-border);
            box-sizing:border-box;
        }
    </style>
</head>

<body onclick="closeAllResults(event)">

<div class="header">
    <div class="logo-container">
        <div style="font-size:24px; font-weight:900; color:var(--accent);">
            FILAMENT STOCK
        </div>
    </div>
</div>

<div class="nav-bar">
    <button class="nav-btn active">INVENTORY</button>
</div>

<div class="section">
    <h2>Inventory Manager</h2>

    <input id="filamentSearchMain"
           placeholder="Click to add a new physical spool..."
           onfocus="updateSearch()"
           oninput="updateSearch()">

    <div id="results-main" class="search-results"></div>

    <!-- NEW ADDITION -->
    <div class="custom-filament-box">
        <h2>Add New Filament Type</h2>

        <div class="custom-filament-row">
            <input id="newBrand" placeholder="Brand (e.g. Bambu Lab)">
            <input id="newType" placeholder="Type (e.g. PLA)">
            <input id="newColour" placeholder="Colour (e.g. Mist Blue)">

            <input type="color"
                   id="newColourPicker"
                   value="#6fa8dc"
                   style="padding:0;">
        </div>

        <div style="margin-top:12px;">
            <button class="btn-print"
                    onclick="addCustomFilament()">
                ADD FILAMENT TYPE
            </button>
        </div>
    </div>

    <div id="ownedList" class="inventory-grid"></div>
</div>

<div class="theme-toggle-container">
    <div class="theme-toggle" onclick="toggleTheme()">
        <div class="theme-toggle-circle"></div>
    </div>
</div>

<script>

let activeFilamentFilter = null;

const COST_PER_GRAM = 0.02;

const filamentsList = [
    "Bambu PLA Black (10101)",
    "Bambu PLA Jade White (10100)",
    "Bambu PLA Matte Charcoal (11101)",
    "Bambu PLA Matte Bone White"
];

const filamentColors = {
    "Black": "#000000",
    "White": "#F8F8F8",
    "Charcoal": "#333333",
    "Bone": "#D8C9B0"
};

function toggleTheme() {
    document.documentElement.classList.toggle('light');

    localStorage.setItem(
        'theme',
        document.documentElement.classList.contains('light')
            ? 'light'
            : 'dark'
    );
}

function getFilamentColor(name) {

    for (const [key, val] of Object.entries(filamentColors)) {

        if(name.includes(key)) {
            return val;
        }
    }

    return "#888";
}

function addNewSpool(name) {

    let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");

    spools.push({
        id: Date.now(),
        name,
        current: 1000,
        max: 1000
    });

    localStorage.setItem('multiSpools', JSON.stringify(spools));

    renderStock();

    forceCloseResults();
}

function renderStock() {

    const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");

    const container = document.getElementById('ownedList');

    container.innerHTML = spools.map(s => {

        return `
        <div class="stock-item">

            <button class="delete-btn"
                    onclick="adjustWeight(${s.id}, -9999)">
                ×
            </button>

            <div style="font-size:10px;
                        opacity:0.7;
                        overflow:hidden;
                        display:flex;
                        justify-content:space-between;">

                <span>${s.name}</span>
            </div>

            <div class="weight-display">
                ${s.current}g
            </div>

            <div class="progress-container">
                <div class="progress-bar"
                     style="width:${(s.current/s.max)*100}%;">
                </div>
            </div>

            <div style="display:flex;
                        justify-content:space-between;
                        align-items:center;">

                <div class="color-dot-large"
                     style="background:${getFilamentColor(s.name)}">
                </div>

                <div class="weight-controls"
                     style="flex-grow:1;
                            margin-left:10px;">

                    <button class="weight-btn"
                            onclick="adjustWeight(${s.id}, -50)">
                        -50g
                    </button>

                    <button class="weight-btn"
                            onclick="adjustWeight(${s.id}, 100)">
                        +100g
                    </button>

                </div>
            </div>
        </div>
        `;
    }).join('');
}

function adjustWeight(id, amount) {

    let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");

    const idx = spools.findIndex(s => s.id === id);

    if (idx !== -1) {

        if (amount === -9999) {

            spools.splice(idx, 1);

        } else {

            spools[idx].current = Math.max(
                0,
                parseFloat(
                    (spools[idx].current + amount).toFixed(2)
                )
            );

            if (spools[idx].current <= 0) {
                spools.splice(idx, 1);
            }
        }
    }

    localStorage.setItem('multiSpools', JSON.stringify(spools));

    renderStock();
}

function updateSearch() {

    const q = document.getElementById('filamentSearchMain')
        .value
        .toLowerCase();

    const res = document.getElementById('results-main');

    res.style.display = 'block';

    res.innerHTML =
        filamentsList
            .filter(f => f.toLowerCase().includes(q))
            .map(f =>
                `<div class="search-item"
                      onmousedown="addNewSpool('${f.replace(/'/g, "\\'")}')">
                    ${f}
                </div>`
            )
            .join('')
        +
        `<div class="search-item"
              style="color:var(--danger)"
              onmousedown="forceCloseResults()">
            Close
        </div>`;
}

function forceCloseResults() {

    document.querySelectorAll('.search-results')
        .forEach(r => r.style.display = 'none');
}

function closeAllResults(e) {

    if (
        !e.target.closest('input') &&
        !e.target.closest('.search-results')
    ) {
        forceCloseResults();
    }
}

/* ===== CUSTOM FILAMENT TYPES ===== */

let customFilaments =
    JSON.parse(localStorage.getItem('customFilaments') || "[]");

let customFilamentColors =
    JSON.parse(localStorage.getItem('customFilamentColors') || "{}");

/* Merge custom filaments into existing list */

customFilaments.forEach(f => {

    if(!filamentsList.includes(f)) {

        filamentsList.push(f);
    }
});

/* Merge custom colours into colour system */

Object.assign(filamentColors, customFilamentColors);

function addCustomFilament() {

    const brand =
        document.getElementById('newBrand').value.trim();

    const type =
        document.getElementById('newType').value.trim();

    const colour =
        document.getElementById('newColour').value.trim();

    const hex =
        document.getElementById('newColourPicker').value;

    if(!brand || !type || !colour){

        alert("Please fill in Brand, Type, and Colour.");

        return;
    }

    const filamentName =
        `${brand} ${type} ${colour}`;

    if(!filamentsList.includes(filamentName)){

        filamentsList.push(filamentName);
    }

    customFilaments.push(filamentName);

    customFilamentColors[colour] = hex;

    localStorage.setItem(
        'customFilaments',
        JSON.stringify(customFilaments)
    );

    localStorage.setItem(
        'customFilamentColors',
        JSON.stringify(customFilamentColors)
    );

    filamentColors[colour] = hex;

    document.getElementById('newBrand').value = '';

    document.getElementById('newType').value = '';

    document.getElementById('newColour').value = '';

    updateSearch();

    alert(`Added: ${filamentName}`);
}

if (localStorage.getItem('theme') === 'light') {

    document.documentElement.classList.add('light');
}

renderStock();

</script>

</body>
</html>
