<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filament Stock Checker</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%2300FF7F' stroke-width='8'/><circle cx='50' cy='50' r='12' fill='%2300FF7F'/><g stroke='%2300FF7F' stroke-width='8' stroke-linecap='round'><line x1='50' y1='20' x2='50' y2='38'/><line x1='24' y1='65' x2='40' y2='56'/><line x1='76' y1='65' x2='60' y2='56'/></g></svg>">

<style>
:root {
    --bg:#1A1A1A;
    --card:#232323;
    --border:#2E2E2E;
    --text:#EAEAEA;
    --accent:#00FF7F;
    --danger:#FF4C4C;
    --warning:#FFD700;
    --null:#666;
    --shadow:0 4px 14px rgba(0,0,0,0.35);
    --dot-border:rgba(255,255,255,0.8);
    --btn-text:#000;
}

:root.light {
    --bg:#FFFFFF;
    --card:#F2F2F2;
    --border:#CCCCCC;
    --text:#111;
    --accent:#00B368;
    --danger:#E53935;
    --warning:#F9A825;
    --null:#888;
    --shadow:0 4px 14px rgba(0,0,0,0.12);
    --dot-border:rgba(0,0,0,0.3);
    --btn-text:#FFF;
}

body{
    margin:0;
    padding:0 20px 100px;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",sans-serif;
}

.scene{display:none;}
.scene.active{display:block;}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:30px 0;
    max-width:1100px;
    margin:0 auto;
}

.logo-container{
    display:flex;
    align-items:center;
    gap:12px;
}

#logo-svg{
    width:48px;
    height:48px;
}

.nav-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

.nav-btn{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.nav-btn.active{
    border-color:var(--accent);
    color:var(--accent);
}

.section{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
    margin:20px auto;
    max-width:1100px;
    box-shadow:var(--shadow);
}

h2{
    margin-top:0;
    font-size:14px;
    color:var(--accent);
    text-transform:uppercase;
}

input,select{
    width:100%;
    padding:14px;
    border-radius:10px;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    font-size:15px;
    margin-bottom:12px;
    box-sizing:border-box;
}

.inventory-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:15px;
}

@media(max-width:900px){
    .inventory-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .inventory-grid{
        grid-template-columns:1fr;
    }
}

.stock-item{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    position:relative;
}

.weight-display{
    font-size:22px;
    font-weight:800;
    color:var(--accent);
}

.progress-container{
    width:100%;
    height:7px;
    background:#333;
    border-radius:4px;
    margin:10px 0;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:var(--accent);
}

.weight-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:8px;
}

.weight-btn{
    padding:10px;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
}

.btn-print{
    width:100%;
    background:var(--accent);
    color:var(--btn-text);
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:800;
}

.search-results{
    max-height:350px;
    overflow-y:auto;
    background:var(--bg);
    border:2px solid var(--accent);
    border-radius:10px;
    display:none;
    margin-bottom:15px;
}

.search-item{
    padding:14px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
}

.search-item:hover{
    background:var(--card);
}

.color-dot-large{
    width:24px;
    height:24px;
    border-radius:50%;
    border:2px solid var(--dot-border);
}

.mini-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid var(--dot-border);
    display:inline-block;
}

.delete-btn{
    position:absolute;
    top:12px;
    right:12px;
    background:none;
    border:none;
    color:var(--danger);
    font-size:20px;
    cursor:pointer;
}

.theme-toggle-container{
    position:fixed;
    bottom:30px;
    right:30px;
}

.theme-toggle{
    width:60px;
    height:32px;
    background:var(--border);
    border-radius:30px;
    cursor:pointer;
    position:relative;
}

.theme-toggle-circle{
    width:24px;
    height:24px;
    background:var(--accent);
    border-radius:50%;
    position:absolute;
    top:4px;
    left:4px;
    transition:0.4s;
}

:root.light .theme-toggle-circle{
    left:32px;
}
</style>
</head>

<body onclick="closeAllResults(event)">

<div class="header">
<div class="logo-container">
<svg id="logo-svg" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="4" opacity="0.1"/>
<circle cx="50" cy="50" r="12" fill="var(--accent)"/>
</svg>
<div style="font-size:24px;font-weight:900;color:var(--accent);">
FILAMENT STOCK
</div>
</div>
</div>

<div class="nav-bar">
<button class="nav-btn active" id="btn-inventory" onclick="switchScene('inventory')">INVENTORY</button>
<button class="nav-btn" id="btn-create" onclick="switchScene('create')">CREATE PROJECT</button>
</div>

<div id="scene-inventory" class="scene active">

<div class="section">

<h2>Inventory Manager</h2>

<input id="filamentSearchMain"
placeholder="Click to add a new physical spool..."
onfocus="updateSearch()"
oninput="updateSearch()">

<div id="results-main" class="search-results"></div>

<!-- NEW FILAMENT CREATOR -->

<div style="margin:20px 0;padding:18px;border:1px solid var(--border);border-radius:12px;background:var(--bg);">

<h2>Add New Filament Type</h2>

<input id="newBrand" placeholder="Brand (e.g. Bambu Lab)">

<select id="newType">
<option value="PLA">PLA</option>
<option value="PLA Matte">PLA Matte</option>
<option value="PETG">PETG</option>
<option value="ABS">ABS</option>
<option value="ASA">ASA</option>
<option value="TPU">TPU</option>
</select>

<input id="newColourName" placeholder="Colour Name (e.g. Mist Blue)">

<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">

<input type="color"
id="newColourHex"
value="#66aaff"
style="width:70px;height:50px;padding:4px;">

<div id="colourPreview"
class="color-dot-large"
style="background:#66aaff;">
</div>

</div>

<button class="btn-print" onclick="createCustomFilament()">
Add Filament Type
</button>

</div>

<div id="ownedList" class="inventory-grid"></div>

</div>
</div>

<div id="scene-create" class="scene">

<div class="section">

<h2>Create Custom Project</h2>

<input id="customProjName" placeholder="Project Name">

<div id="customInputs">
<div style="display:flex;gap:10px;">
<select class="custom-fil-select"></select>
<input type="number" class="custom-fil-grams" placeholder="Grams">
</div>
</div>

<button class="btn-print" onclick="addCustomInput()">
+ Add Another Colour
</button>

</div>
</div>

<div class="theme-toggle-container">
<div class="theme-toggle" onclick="toggleTheme()">
<div class="theme-toggle-circle"></div>
</div>
</div>

<script>

const COST_PER_GRAM = 0.02;

function switchScene(sceneId){

document.querySelectorAll('.scene').forEach(s=>{
s.classList.remove('active');
});

document.querySelectorAll('.nav-btn').forEach(b=>{
b.classList.remove('active');
});

document.getElementById('scene-' + sceneId).classList.add('active');
document.getElementById('btn-' + sceneId).classList.add('active');
}

const defaultFilaments = [

{ name:"Bambu PLA Black (10101)", color:"#000000" },
{ name:"Bambu PLA Jade White (10100)", color:"#F8F8F8" },
{ name:"Bambu PLA Matte Charcoal (11101)", color:"#333333" },
{ name:"Bambu PLA Matte Dark Blue", color:"#1a73e8" },
{ name:"Bambu PLA Matte Dark Red", color:"#d93025" },
{ name:"Bambu PLA Matte Yellow", color:"#f9ab00" }

];

function getCustomFilaments(){
return JSON.parse(localStorage.getItem('customFilaments') || "[]");
}

function getAllFilaments(){
return [...defaultFilaments, ...getCustomFilaments()];
}

function getFilamentColor(name){
const found = getAllFilaments().find(f=>f.name===name);
return found ? found.color : "#888";
}

function updateAllFilamentSelectors(){

const options = getAllFilaments()
.map(f=>`<option value="${f.name}">${f.name}</option>`)
.join('');

document.querySelectorAll('.custom-fil-select').forEach(s=>{
s.innerHTML = options;
});
}

function createCustomFilament(){

const brand = document.getElementById('newBrand').value.trim();
const type = document.getElementById('newType').value.trim();
const colour = document.getElementById('newColourName').value.trim();
const hex = document.getElementById('newColourHex').value;

if(!brand || !type || !colour){
alert("Please fill all fields.");
return;
}

const fullName = `${brand} ${type} ${colour}`;

const custom = getCustomFilaments();

if(custom.some(f=>f.name===fullName)){
alert("Filament already exists.");
return;
}

custom.push({
name:fullName,
color:hex
});

localStorage.setItem(
'customFilaments',
JSON.stringify(custom)
);

updateAllFilamentSelectors();

alert(`Added: ${fullName}`);

document.getElementById('newBrand').value = '';
document.getElementById('newColourName').value = '';
}

function addCustomInput(){

const container = document.getElementById('customInputs');

const options = getAllFilaments()
.map(f=>`<option value="${f.name}">${f.name}</option>`)
.join('');

const div = document.createElement('div');

div.style.display = 'flex';
div.style.gap = '10px';

div.innerHTML = `
<select class="custom-fil-select">${options}</select>
<input type="number" class="custom-fil-grams" placeholder="Grams">
`;

container.appendChild(div);
}

function addNewSpool(name){

let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");

spools.push({
id:Date.now(),
name,
current:1000,
max:1000
});

localStorage.setItem('multiSpools', JSON.stringify(spools));

renderStock();

forceCloseResults();
}

function adjustWeight(id, amount){

let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");

const idx = spools.findIndex(s=>s.id===id);

if(idx !== -1){

if(amount === -9999){

spools.splice(idx,1);

}else{

spools[idx].current = Math.max(
0,
spools[idx].current + amount
);

if(spools[idx].current <= 0){
spools.splice(idx,1);
}
}
}

localStorage.setItem('multiSpools', JSON.stringify(spools));

renderStock();
}

function renderStock(){

const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");

const container = document.getElementById('ownedList');

spools.sort((a,b)=>a.name.localeCompare(b.name));

container.innerHTML = spools.map(s=>{

const spoolVal = (s.current * COST_PER_GRAM).toFixed(2);

return `
<div class="stock-item">

<button class="delete-btn"
onclick="adjustWeight(${s.id}, -9999)">
×
</button>

<div style="font-size:12px;opacity:0.7;">
${s.name}
</div>

<div class="weight-display">
${s.current}g
</div>

<div class="progress-container">
<div class="progress-bar"
style="width:${(s.current/s.max)*100}%;">
</div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;">

<div class="color-dot-large"
style="background:${getFilamentColor(s.name)}">
</div>

<div style="font-size:12px;">
£${spoolVal}
</div>

</div>

<div class="weight-controls">

<button class="weight-btn"
onclick="adjustWeight(${s.id}, -50)">
-50g
</button>

<button class="weight-btn"
onclick="adjustWeight(${s.id}, 100)">
+100g
</button>

</div>

</div>
`;

}).join('');
}

function updateSearch(){

const q = document
.getElementById('filamentSearchMain')
.value
.toLowerCase();

const res = document.getElementById('results-main');

res.style.display = 'block';

const matches = getAllFilaments()
.filter(f=>f.name.toLowerCase().includes(q));

res.innerHTML = matches.map(f=>`

<div class="search-item"
onmousedown="addNewSpool('${f.name.replace(/'/g,"\\'")}')"
style="display:flex;align-items:center;gap:10px;">

<div class="mini-dot"
style="background:${f.color}">
</div>

${f.name}

</div>

`).join('') + `

<div class="search-item"
style="color:var(--danger)"
onmousedown="forceCloseResults()">

Close

</div>
`;
}

function forceCloseResults(){

document.querySelectorAll('.search-results')
.forEach(r=>r.style.display='none');
}

function closeAllResults(e){

if(
!e.target.closest('input') &&
!e.target.closest('.search-results')
){
forceCloseResults();
}
}

function toggleTheme(){

document.documentElement.classList.toggle('light');

localStorage.setItem(
'theme',
document.documentElement.classList.contains('light')
? 'light'
: 'dark'
);
}

document.addEventListener('input',(e)=>{

if(e.target.id === 'newColourHex'){

document.getElementById('colourPreview')
.style.background = e.target.value;
}
});

if(localStorage.getItem('theme') === 'light'){
document.documentElement.classList.add('light');
}

updateAllFilamentSelectors();

renderStock();

</script>
</body>
</html>
