<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Stock Checker</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%2300FF7F' stroke-width='8'/><circle cx='50' cy='50' r='12' fill='%2300FF7F'/><g stroke='%2300FF7F' stroke-width='8' stroke-linecap='round'><line x1='50' y1='20' x2='50' y2='38'/><line x1='24' y1='65' x2='40' y2='56'/><line x1='76' y1='65' x2='60' y2='56'/></g></svg>">

    <style>
        :root {
            --bg: #1A1A1A; --card: #232323; --border: #2E2E2E; --text: #EAEAEA;
            --accent: #00FF7F; --danger: #FF4C4C; --warning: #FFD700; --null: #666; --shadow: 0 4px 14px rgba(0,0,0,0.35);
            --dot-border: rgba(255,255,255,0.8);
            --btn-text: #000000;
        }
        :root.light {
            --bg: #FFFFFF; --card: #F2F2F2; --border: #CCCCCC; --text: #111;
            --accent: #00B368; --danger: #E53935; --warning: #F9A825; --null: #888; --shadow: 0 4px 14px rgba(0,0,0,0.12);
            --dot-border: rgba(0,0,0,0.3);
            --btn-text: #FFFFFF;
        }

        body { margin: 0; padding: 0 20px 100px 20px; background: var(--bg); color: var(--text); font-family: "Segoe UI", sans-serif; transition: 0.25s; }
        
        .scene { display: none; }
        .scene.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .nav-bar { display: flex; justify-content: center; gap: 10px; margin: 0 auto 20px auto; max-width: 1100px; padding: 10px 0; }
        .nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .nav-btn.active { border-color: var(--accent); color: var(--accent); }
        :root.light .nav-btn.active { background: var(--accent); color: white; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; max-width: 1100px; margin: 0 auto; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        #logo-svg { width: 48px; height: 48px; overflow: visible; }
        
        .animate-spin { animation: spoolSpin 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: center; }
        @keyframes spoolSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; max-width: 1100px; margin: 20px auto; box-shadow: var(--shadow); position: relative; }
        h2 { margin-top: 0; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.9; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 15px; margin-bottom: 12px; box-sizing: border-box; outline: none; }

        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 15px; }
        @media (max-width: 900px) { .inventory-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .inventory-grid { grid-template-columns: 1fr; } }

        .stock-item { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 180px; position: relative; transition: box-shadow 0.3s; }
        .stock-item.low-stock-alert { border-color: var(--warning); box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .low-stock-text { color: var(--warning) !important; }

        .weight-display { font-size: 22px; font-weight: 800; color: var(--accent); margin: 5px 0; }
        .progress-container { width: 100%; height: 7px; background: #333; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); transition: width 0.6s ease; }

        .waste-tools { display: flex; gap: 5px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
        .btn-waste { flex: 1; padding: 6px; font-size: 10px; background: rgba(255, 76, 76, 0.1); color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-waste:hover { background: var(--danger); color: white; }

        .weight-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
        .weight-btn { padding: 10px; font-size: 11px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; }

        .btn-print { width: 100%; background: var(--accent); color: var(--btn-text); padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: 0.2s; }
        .btn-add { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 8px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: none; color: var(--danger); border: none; cursor: pointer; font-size: 20px; opacity: 0.3; }
        
        .avail-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .avail-item { background: var(--bg); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; font-size: 13px; cursor: pointer; width: 220px; transition: 0.2s; }
        .avail-item:hover { border-color: var(--accent); transform: translateY(-2px); }

        /* Prevent dropdown cut-off in Create Scene */
        #scene-create .section { padding-bottom: 100px; }

        .theme-toggle-container { position: fixed; bottom: 30px; right: 30px; z-index: 999; }
        .theme-toggle { width: 60px; height: 32px; background: var(--border); border-radius: 30px; cursor: pointer; position: relative; }
        .theme-toggle-circle { width: 24px; height: 24px; background: var(--accent); border-radius: 50%; position: absolute; top: 4px; left: 4px; transition: 0.4s; }
        :root.light .theme-toggle-circle { left: 32px; }

        #clear-filter-btn { display: none; background: var(--danger); color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; margin-left: 10px; }
        .search-results { max-height: 350px; overflow-y: auto; background: var(--bg); border: 2px solid var(--accent); border-radius: 10px; margin-bottom: 15px; display: none; z-index: 1000; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-item { padding: 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .search-item:hover { background: var(--card); color: var(--accent); }
    </style>
</head>
<body onclick="closeAllResults(event)">

<div class="header">
    <div class="logo-container" onclick="triggerLogoAnimation(); switchScene('projects');">
        <svg id="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="4" opacity="0.1"/>
            <circle cx="50" cy="50" r="12" fill="var(--accent)"/>
            <g stroke="var(--accent)" stroke-width="8" stroke-linecap="round">
                <line x1="50" y1="15" x2="50" y2="35"/><line x1="20" y1="68" x2="38" y2="58"/><line x1="80" y1="68" x2="62" y2="58"/>
            </g>
        </svg>
        <div style="font-size: 24px; font-weight: 900; color: var(--accent);">FILAMENT STOCK</div>
    </div>
</div>

<div class="nav-bar">
    <button class="nav-btn active" id="btn-projects" onclick="switchScene('projects')">PROJECTS</button>
    <button class="nav-btn" id="btn-inventory" onclick="switchScene('inventory')">INVENTORY</button>
    <button class="nav-btn" id="btn-create" onclick="switchScene('create')">CREATE NEW</button>
</div>

<div id="scene-projects" class="scene active">
    <div class="section">
        <div style="display:flex; align-items:center; margin-bottom:15px;">
            <h2 id="project-header">Project Availability</h2>
            <button id="clear-filter-btn" onclick="clearFilter()">CLEAR FILTER</button>
        </div>
        <h2>Ready to Print</h2>
        <div id="readyList" class="avail-list"></div>
        <h2 style="margin-top: 25px; color: var(--warning);">Almost Ready (70%+)</h2>
        <div id="almostList" class="avail-list"></div>
        <h2 style="margin-top: 25px; color: var(--danger);">Missing Materials</h2>
        <div id="missingList" class="avail-list"></div>
    </div>
</div>

<div id="scene-inventory" class="scene">
    <div class="section">
        <h2>Inventory Manager</h2>
        <input id="filamentSearchMain" placeholder="Search to add a new physical spool..." onfocus="updateSearch()" oninput="updateSearch()">
        <div id="results-main" class="search-results"></div>
        <div id="ownedList" class="inventory-grid"></div>
    </div>
</div>

<div id="scene-create" class="scene">
    <div class="section">
        <h2>Create Custom Project</h2>
        <input id="customProjName" placeholder="Project Name">
        <div id="customInputs">
            </div>
        <button class="btn-add" onclick="addCustomInput()">+ Add Material</button>
        <button class="btn-print" onclick="saveCustomProject()">Save Project</button>
    </div>
</div>

<div class="theme-toggle-container">
    <div class="theme-toggle" onclick="toggleTheme()"><div class="theme-toggle-circle"></div></div>
</div>

<script>
    let activeFilamentFilter = null;
    const LOW_STOCK_THRESHOLD = 150;

    const filamentsList = ["Bambu PLA Black (10101)", "Bambu PLA Jade White (10100)", "Bambu PLA Matte Charcoal (11101)", "Bambu PLA Matte Bone White", "Bambu PLA Matte Dark Blue (11602)", "Bambu PLA Matte Dark Red", "Bambu PLA Matte Dark Brown (11801)", "Bambu PLA Matte Ash Grey (11102)"];

    const playbookProjects = {
        "Backgammon Set": [{ f: "Bambu PLA Matte Dark Brown (11801)", g: 150 }, { f: "Bambu PLA Matte Bone White", g: 120 }, { f: "Bambu PLA Matte Dark Blue (11602)", g: 43 }],
        "Chess Set": [{ f: "Bambu PLA Matte Dark Brown (11801)", g: 320 }, { f: "Bambu PLA Matte Bone White", g: 320 }],
        "Sea Battle": [{ f: "Bambu PLA Matte Dark Blue (11602)", g: 310 }, { f: "Bambu PLA Matte Ash Grey (11102)", g: 215 }, { f: "Bambu PLA Matte Dark Red", g: 31 }, { f: "Bambu PLA Matte Bone White", g: 25 }]
    };

    function switchScene(sceneId) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('scene-' + sceneId).classList.add('active');
        document.getElementById('btn-' + sceneId).classList.add('active');
        if(sceneId === 'projects') updateAvailableProjects();
        if(sceneId === 'create') { 
            document.getElementById('customInputs').innerHTML = '';
            addCustomInput(); 
        }
        window.scrollTo(0,0);
    }

    function toggleTheme() {
        document.documentElement.classList.toggle('light');
        localStorage.setItem('theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
    }

    // --- INVENTORY LOGIC ---
    function getCombinedStock() {
        const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const totals = {};
        spools.forEach(s => { totals[s.name] = (totals[s.name] || 0) + s.current; });
        return totals;
    }

    function renderStock() {
        const spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const container = document.getElementById('ownedList');
        spools.sort((a,b) => a.name.localeCompare(b.name));
        container.innerHTML = spools.map(s => {
            const isLow = s.current < LOW_STOCK_THRESHOLD;
            return `<div class="stock-item ${isLow ? 'low-stock-alert' : ''}">
                <button class="delete-btn" onclick="adjustWeight(${s.id}, -9999)">×</button>
                <div style="font-size:10px; opacity:0.7; cursor:pointer;" onclick="filterByFilament('${s.name}')">${s.name}</div>
                <div class="weight-display ${isLow ? 'low-stock-text' : ''}">${s.current}g</div>
                <div class="progress-container"><div class="progress-bar" style="width:${(s.current/s.max)*100}%; background:${isLow ? 'var(--warning)' : 'var(--accent)'}"></div></div>
                <div class="weight-controls">
                    <button class="weight-btn" onclick="adjustWeight(${s.id}, -50)">-50g</button>
                    <button class="weight-btn" onclick="adjustWeight(${s.id}, 100)">+100g</button>
                </div>
                <div class="waste-tools">
                    <button class="btn-waste" onclick="adjustWeight(${s.id}, -5)">-5g (PURGE)</button>
                    <button class="btn-waste" style="background:rgba(255,76,76,0.3)" onclick="adjustWeight(${s.id}, -50)">-50g (FAIL)</button>
                </div>
            </div>`}).join('');
    }

    function adjustWeight(id, amount) {
        let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        const idx = spools.findIndex(s => s.id === id);
        if (idx !== -1) {
            if (amount === -9999) spools.splice(idx, 1);
            else {
                spools[idx].current = Math.max(0, parseFloat((spools[idx].current + amount).toFixed(2)));
            }
        }
        localStorage.setItem('multiSpools', JSON.stringify(spools));
        renderStock();
    }

    function updateSearch() {
        const q = document.getElementById('filamentSearchMain').value.toLowerCase();
        const res = document.getElementById('results-main'); res.style.display = 'block';
        res.innerHTML = filamentsList.filter(f => f.toLowerCase().includes(q)).map(f => `<div class="search-item" onmousedown="addNewSpool('${f.replace(/'/g, "\\'")}')">${f}</div>`).join('') + `<div class="search-item" style="color:var(--danger)" onmousedown="forceCloseResults()">Close</div>`;
    }

    function addNewSpool(name) {
        let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");
        spools.push({ id: Date.now(), name, current: 1000, max: 1000 });
        localStorage.setItem('multiSpools', JSON.stringify(spools));
        renderStock(); forceCloseResults();
        document.getElementById('filamentSearchMain').value = '';
    }

    // --- PROJECT LOGIC ---
    function updateAvailableProjects() {
        const stock = getCombinedStock();
        const custom = JSON.parse(localStorage.getItem('customProjects') || "{}");
        const all = { ...playbookProjects, ...custom };
        
        const lists = { ready: [], almost: [], missing: [] };
        const filterBtn = document.getElementById('clear-filter-btn');
        filterBtn.style.display = activeFilamentFilter ? 'block' : 'none';

        Object.keys(all).forEach(name => {
            const reqs = all[name];
            if(activeFilamentFilter && !reqs.some(r => r.f === activeFilamentFilter)) return;

            let totalReq = 0, totalHave = 0;
            reqs.forEach(r => {
                totalReq += r.g;
                totalHave += Math.min(r.g, stock[r.f] || 0);
            });

            const pct = totalHave / totalReq;
            const html = `<div class="avail-item" onclick="confirmPrint('${name.replace(/'/g, "\\'")}')">
                <div style="font-weight:bold">${name}</div>
                <div style="font-size:11px; opacity:0.6">${totalReq}g required</div>
            </div>`;

            if (pct >= 1) lists.ready.push(html);
            else if (pct >= 0.7) lists.almost.push(html);
            else lists.missing.push(html);
        });

        document.getElementById('readyList').innerHTML = lists.ready.join('');
        document.getElementById('almostList').innerHTML = lists.almost.join('');
        document.getElementById('missingList').innerHTML = lists.missing.join('');
    }

    function confirmPrint(name) {
        if(confirm(`Deduct grams for ${name}?`)) {
            const custom = JSON.parse(localStorage.getItem('customProjects') || "{}");
            const all = { ...playbookProjects, ...custom };
            const reqs = all[name];
            let spools = JSON.parse(localStorage.getItem('multiSpools') || "[]");

            reqs.forEach(r => {
                let needed = r.g;
                for(let s of spools) {
                    if(s.name === r.f && needed > 0) {
                        let take = Math.min(s.current, needed);
                        s.current -= take;
                        needed -= take;
                    }
                }
            });
            localStorage.setItem('multiSpools', JSON.stringify(spools));
            triggerLogoAnimation();
            renderStock();
            updateAvailableProjects();
        }
    }

    function filterByFilament(name) {
        activeFilamentFilter = name;
        switchScene('projects');
    }

    function clearFilter() {
        activeFilamentFilter = null;
        updateAvailableProjects();
    }

    // --- CUSTOM CREATE LOGIC ---
    function addCustomInput() {
        const container = document.getElementById('customInputs');
        const div = document.createElement('div');
        div.style.display = 'flex';
        div.style.gap = '10px';
        
        const sel = document.createElement('select');
        sel.className = 'custom-fil-select';
        filamentsList.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f; opt.textContent = f;
            sel.appendChild(opt);
        });

        div.innerHTML = `
            <input type="number" class="custom-fil-grams" placeholder="Grams" style="flex:1">
        `;
        div.insertBefore(sel, div.firstChild);
        container.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function saveCustomProject() {
        const name = document.getElementById('customProjName').value;
        if(!name) return alert("Project Name required");
        
        const rows = document.querySelectorAll('#customInputs > div');
        const reqs = [];
        rows.forEach(row => {
            const f = row.querySelector('select').value;
            const g = parseFloat(row.querySelector('input').value);
            if(f && g) reqs.push({ f, g });
        });

        const custom = JSON.parse(localStorage.getItem('customProjects') || "{}");
        custom[name] = reqs;
        localStorage.setItem('customProjects', JSON.stringify(custom));
        
        document.getElementById('customProjName').value = '';
        switchScene('projects');
    }

    // --- UTILS ---
    function forceCloseResults() { document.querySelectorAll('.search-results').forEach(r => r.style.display = 'none'); }
    function closeAllResults(e) { if (!e.target.closest('input') && !e.target.closest('.search-results')) forceCloseResults(); }
    function triggerLogoAnimation() {
        const logo = document.getElementById('logo-svg');
        logo.classList.remove('animate-spin');
        void logo.offsetWidth;
        logo.classList.add('animate-spin');
    }

    // Load Initial State
    if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
    renderStock();
    updateAvailableProjects();
</script>

</body>
</html>
